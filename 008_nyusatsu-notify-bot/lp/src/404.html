<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ページが見つかりません | 入札情報ウォッチ</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root {
    --bg: #f7f8fa;
    --ink: #1c1e1f;
    --ink-soft: #55585c;
    --accent: #2b6cb0;
    --line: #dde3ea;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.75;
  }
  .box {
    max-width: 440px;
    margin: 24px;
    padding: 2.5rem 2rem;
    text-align: center;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .brand { font-weight: 700; font-size: 14px; color: var(--accent); margin-bottom: 18px; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  p { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 24px; }
  a.btn {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="brand">入札情報ウォッチ</div>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。URLをご確認いただくか、トップページからやり直してください。</p>
    <a class="btn" href="/">トップページに戻る</a>
  </div>
</body>
</html>

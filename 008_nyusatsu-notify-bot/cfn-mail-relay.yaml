AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Nyusatsu Notify Bot (008) - Inbound mail relay for nyusatsu@zer0-infra.com.
  SES receives mail into S3, a Lambda forwards it to the owner's mailbox via
  SES, and a custom resource activates the SES receipt rule set (no native
  CloudFormation resource exists for that account-level setting).

# -----------------------------------------------
# Parameters
# 受信アドレス・転送元(検証済みドメイン)アドレスをパラメータ化する。
# -----------------------------------------------
Parameters:
  ReceivingAddress:
    Type: String
    Default: nyusatsu@zer0-infra.com
    Description: SESで受信する問合せ用メールアドレス
  ForwardFromAddress:
    Type: String
    Default: relay@info.zer0-infra.com
    Description: 転送メールのSource（SESで検証済みのinfo.zer0-infra.comドメイン配下）
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 7
      - 14
      - 30
    Description: Lambda実行ログの保持日数
  NotifyEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /zer0/008-nyusatsu/notify-email
    Description: 転送Lambda異常時のアラーム通知を受け取るメールアドレス(メインスタックが作成するSSMパラメータの値を参照)

# -----------------------------------------------
# Resources
# S3(受信メール一時保管) -> Lambda(転送) の非同期パイプラインと、
# SES受信ルールセット・ルール、ルールセット有効化用カスタムリソースを定義する。
# -----------------------------------------------
Resources:
  MailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: zer0-nyusatsu-mail-s3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-incoming-mail
            Status: Enabled
            Prefix: incoming/
            ExpirationInDays: 30
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ForwarderFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
    DependsOn:
      - ForwarderInvokePermission

  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSESPuts
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${MailBucket}/incoming/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ForwarderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/zer0-nyusatsu-mail-forwarder
      RetentionInDays: !Ref LogRetentionDays

  # 転送失敗時（例: SESのSendRawEmail上限約10MBを超える大きな添付）に
  # 問合せメールがサイレントに消失しないよう、非同期呼び出し失敗時の
  # 退避先として使う。
  ForwarderDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: zer0-nyusatsu-mail-forwarder-dlq
      MessageRetentionPeriod: 1209600

  # IAM Role for the mail forwarder Lambda function.
  # Description must stay ASCII-only per project convention.
  ForwarderFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zer0-nyusatsu-mail-forwarder-role
      Description: Execution role for Nyusatsu inbound mail forwarder Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: zer0-nyusatsu-mail-forwarder-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ForwarderLogGroup.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                # ハードコードしたARN文字列を使用(MailBucketへの!Ref/!Sub参照は
                # MailBucket→ForwarderFunction→ForwarderFunctionRole→MailBucket
                # という循環依存をCFnに検出されるため)。バケット名はBucketNameで
                # 固定済みなので実害はない。
                Resource: "arn:aws:s3:::zer0-nyusatsu-mail-s3/incoming/*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zer0/008-nyusatsu/notify-email
              - Effect: Allow
                Action:
                  - ses:SendRawEmail
                Resource: "*"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ForwarderDLQ.Arn

  ForwarderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: zer0-nyusatsu-mail-forwarder
      Description: nyusatsu@zer0-infra.com宛メールを個人メールアドレスへ転送する
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt ForwarderFunctionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          NOTIFY_EMAIL_PARAM_NAME: /zer0/008-nyusatsu/notify-email
          FORWARD_FROM_ADDRESS: !Ref ForwardFromAddress
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              # Placeholder (Handler does not match this file, so this
              # never actually executes). Real code is deployed via
              # `aws lambda update-function-code` per CLAUDE.md rule
              # (no SAM, no S3 build artifact) before this function is
              # invoked by any real trigger.
              return {"statusCode": 200, "body": "placeholder"}
    DependsOn:
      - ForwarderLogGroup

  ForwarderEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ForwarderFunction
      Qualifier: "$LATEST"
      MaximumRetryAttempts: 2
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt ForwarderDLQ.Arn

  ForwarderInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ForwarderFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::zer0-nyusatsu-mail-s3"

  # SNS Topic for CloudWatch Alarm notifications (this stack's own, self-contained).
  # ForwarderDLQ滞留アラームの通知先。
  ForwarderAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: zer0-nyusatsu-mail-relay-alarm-topic

  ForwarderAlarmTopicSubscription01:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ForwarderAlarmTopic
      Protocol: email
      Endpoint: !Ref NotifyEmail

  # CloudWatch Alarm for ForwarderDLQ message buildup.
  # ForwarderDLQにメッセージが1件以上滞留したら発報する。CFnのZipFileプレースホルダー+
  # 手動update-function-codeという2段階デプロイ方式のため、反映漏れで転送Lambdaが
  # 機能しなくなっても本アラーム以外に検知手段がない(2026-07-10 Fableレビュー指摘、
  # v0.9で実際に発生した障害の再発検知用)。
  ForwarderDlqAlarm01:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: zer0-nyusatsu-mail-forwarder-dlq-alarm-01
      AlarmDescription: 問合せメール転送LambdaのDLQにメッセージが滞留しています
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ForwarderDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ForwarderAlarmTopic

  NyusatsuReceiptRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: zer0-nyusatsu-rules

  NyusatsuReceiptRule:
    Type: AWS::SES::ReceiptRule
    Properties:
      RuleSetName: !Ref NyusatsuReceiptRuleSet
      Rule:
        Name: zer0-nyusatsu-inbound
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Optional
        Recipients:
          - !Ref ReceivingAddress
        Actions:
          - S3Action:
              BucketName: !Ref MailBucket
              ObjectKeyPrefix: incoming/
    DependsOn:
      - MailBucketPolicy

  ActivateRuleSetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/zer0-nyusatsu-activate-ruleset
      RetentionInDays: !Ref LogRetentionDays

  # IAM Role for the custom resource that activates the SES receipt rule
  # set (no native CloudFormation resource exists for this account-level
  # setting, so a Lambda-backed custom resource calls the SES API).
  ActivateRuleSetFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zer0-nyusatsu-activate-ruleset-role
      Description: Execution role for SES active receipt rule set custom resource
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: zer0-nyusatsu-activate-ruleset-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ActivateRuleSetLogGroup.Arn
              - Effect: Allow
                Action:
                  - ses:SetActiveReceiptRuleSet
                  - ses:DescribeActiveReceiptRuleSet
                Resource: "*"

  ActivateRuleSetFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: zer0-nyusatsu-activate-ruleset
      Description: CloudFormationカスタムリソース経由でSES受信ルールセットを有効化する
      Runtime: python3.13
      # インラインZipFileはCFn内部で必ずindex.<拡張子>という名前になるため
      # Handlerはindex.lambda_handlerを指定する(lambda_function.pyではない)。
      Handler: index.lambda_handler
      Role: !GetAtt ActivateRuleSetFunctionRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        # CloudFormationがスタック作成中に同期的にこの関数を呼び出し応答を
        # 待つため、placeholder+update-function-codeの2段構成にはできない
        # (プレースホルダのままだと応答が来ずスタックが長時間ハングする)。
        # そのため実コードをここに直接埋め込む。
        ZipFile: |
          import json
          import urllib.request

          import boto3

          ses = boto3.client("ses")


          def send_response(event, context, status, reason=None):
              body = json.dumps(
                  {
                      "Status": status,
                      "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                      "PhysicalResourceId": event.get("PhysicalResourceId")
                      or event["LogicalResourceId"],
                      "StackId": event["StackId"],
                      "RequestId": event["RequestId"],
                      "LogicalResourceId": event["LogicalResourceId"],
                  }
              ).encode("utf-8")
              req = urllib.request.Request(
                  url=event["ResponseURL"],
                  data=body,
                  method="PUT",
                  headers={"Content-Type": ""},
              )
              urllib.request.urlopen(req, timeout=10)


          def lambda_handler(event, context):
              request_type = event["RequestType"]
              rule_set_name = event["ResourceProperties"]["RuleSetName"]

              try:
                  if request_type in ("Create", "Update"):
                      ses.set_active_receipt_rule_set(RuleSetName=rule_set_name)
                  elif request_type == "Delete":
                      # 他スタックが別のルールセットを有効化している場合に
                      # それを巻き込んで無効化しないよう、自分のルールセットが
                      # 現在アクティブな場合のみ解除する。
                      try:
                          active = ses.describe_active_receipt_rule_set()
                          active_name = (active.get("Metadata") or {}).get("Name")
                          if active_name == rule_set_name:
                              ses.set_active_receipt_rule_set()
                      except Exception:
                          pass
                  send_response(event, context, "SUCCESS")
              except Exception as e:
                  send_response(event, context, "FAILED", str(e))

  ActivateRuleSet:
    Type: Custom::ActivateSesRuleSet
    Properties:
      ServiceToken: !GetAtt ActivateRuleSetFunction.Arn
      RuleSetName: !Ref NyusatsuReceiptRuleSet
    DependsOn:
      - NyusatsuReceiptRule

# -----------------------------------------------
# Outputs
# 受信バケット名を運用確認用に出力する。
# -----------------------------------------------
Outputs:
  MailBucketName:
    Description: S3 bucket name for incoming raw mail
    Value: !Ref MailBucket

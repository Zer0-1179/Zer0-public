AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Nyusatsu Notify Bot (008) - Waitlist registration backend for the LP
  (nyusatsu.zer0-infra.com). HTTP API + Lambda + DynamoDB, all pay-per-use
  to keep idle cost near zero.

# -----------------------------------------------
# Metadata
# ParameterGroups でLP設定・ログ設定を視覚的にグループ化する。
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: LP設定
        Parameters:
          - AllowedOrigin
      - Label:
          default: ログ設定
        Parameters:
          - LogRetentionDays
    ParameterLabels:
      AllowedOrigin:
        default: CORSで許可するLPのオリジン
      LogRetentionDays:
        default: CloudWatch Logs保持日数

# -----------------------------------------------
# Parameters
# LPのオリジン（CORS許可用）とログ保持日数を指定する。
# 通知先・SES送信元は008メインスタックのSSMパラメータを再利用するため
# ここでは定義しない。
# -----------------------------------------------
Parameters:
  AllowedOrigin:
    Type: String
    Default: https://nyusatsu.zer0-infra.com
    Description: 事前登録フォームからのfetchを許可するオリジン
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 7
      - 14
      - 30
    Description: Lambda実行ログの保持日数
  WaitlistCodeVersion:
    Type: String
    Description: lambda/lp_waitlist.zipのS3バージョンID
  StripeWebhookCodeVersion:
    Type: String
    Description: lambda/stripe_webhook.zipのS3バージョンID

# -----------------------------------------------
# Resources
# DynamoDB(事前登録メール, PAY_PER_REQUEST) + Lambda(登録・二重オプトイン確認・
# 配信停止処理) + HTTP API(POST /register, GET /confirm, GET+POST /unsubscribe)
# を定義する。008メインスタックの通知先/SES送信元/HMAC秘密鍵SSMパラメータ・
# マッチ履歴テーブル(zer0-nyusatsu-match-history)を読み取り専用でそのまま再利用する
# (確認時のバックフィルウェルカムメール用、v0.11)。
# -----------------------------------------------
Resources:
  WaitlistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: zer0-nyusatsu-lp-waitlist
      BillingMode: PAY_PER_REQUEST
      # 課金開始後は顧客リストそのものになるため、誤オペ(Scan+一括更新のミス等)
      # からの復旧手段としてPITRを有効化する(Fable指摘、レビュー2026-07-11。
      # PAY_PER_REQUESTかつテーブルサイズが小さいためコスト影響はほぼ無い)。
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  WaitlistLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/zer0-nyusatsu-lp-waitlist
      RetentionInDays: !Ref LogRetentionDays

  # IAM Role for the waitlist registration Lambda function.
  # Description must stay ASCII-only per project convention.
  WaitlistFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zer0-nyusatsu-lp-waitlist-role
      Description: Execution role for Nyusatsu LP waitlist registration Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: zer0-nyusatsu-lp-waitlist-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WaitlistLogGroup.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt WaitlistTable.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nyusatsu/notify-email
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nyusatsu/ses-sender
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nyusatsu/hmac-secret
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nyusatsu/line-channel-access-token
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nyusatsu/line-channel-secret
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nyusatsu/line-liff-id
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zer0-nyusatsu-match-history
                  - !GetAtt WaitlistTable.Arn
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

  WaitlistFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: zer0-nyusatsu-lp-waitlist
      Description: LP事前登録・二重オプトイン確認・配信停止をDynamoDB+SESで処理する
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt WaitlistFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          WAITLIST_TABLE_NAME: !Ref WaitlistTable
          NOTIFY_EMAIL_PARAM_NAME: /nyusatsu/notify-email
          SES_SENDER_PARAM_NAME: /nyusatsu/ses-sender
          HMAC_SECRET_PARAM_NAME: /nyusatsu/hmac-secret
          SES_CONFIGURATION_SET_NAME: zer0-nyusatsu-config-set
          MATCH_HISTORY_TABLE_NAME: zer0-nyusatsu-match-history
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          LINE_CHANNEL_ACCESS_TOKEN_PARAM_NAME: /nyusatsu/line-channel-access-token
          LINE_CHANNEL_SECRET_PARAM_NAME: /nyusatsu/line-channel-secret
          LINE_LIFF_ID_PARAM_NAME: /nyusatsu/line-liff-id
      Code:
        S3Bucket: !ImportValue zer0-nyusatsu-lambda-artifacts-bucket-name
        S3Key: lambda/lp_waitlist.zip
        S3ObjectVersion: !Ref WaitlistCodeVersion
    DependsOn:
      - WaitlistLogGroup

  WaitlistApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: zer0-nyusatsu-lp-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - POST
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type

  WaitlistIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WaitlistFunction.Arn
      PayloadFormatVersion: "2.0"

  WaitlistRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /register"
      Target: !Sub "integrations/${WaitlistIntegration}"

  ConfirmRoute01:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /confirm"
      Target: !Sub "integrations/${WaitlistIntegration}"

  UnsubscribeRoute01:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /unsubscribe"
      Target: !Sub "integrations/${WaitlistIntegration}"

  UnsubscribeRoute02:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /unsubscribe"
      Target: !Sub "integrations/${WaitlistIntegration}"

  FaviconRoute01:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /favicon.ico"
      Target: !Sub "integrations/${WaitlistIntegration}"

  LineLinkRoute01:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /line/link"
      Target: !Sub "integrations/${WaitlistIntegration}"

  LineWebhookRoute01:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /line/webhook"
      Target: !Sub "integrations/${WaitlistIntegration}"

  WaitlistStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WaitlistApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  WaitlistApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WaitlistFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WaitlistApi}/*/*"

  StripeWebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/zer0-nyusatsu-stripe-webhook
      RetentionInDays: !Ref LogRetentionDays

  # IAM Role for the Stripe webhook receiver Lambda function.
  # Description must stay ASCII-only per project convention.
  StripeWebhookFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zer0-nyusatsu-stripe-webhook-role
      Description: Execution role for Nyusatsu Stripe webhook receiver Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: zer0-nyusatsu-stripe-webhook-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt StripeWebhookLogGroup.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource: !GetAtt WaitlistTable.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nyusatsu/stripe-webhook-secret-secure
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nyusatsu/notify-email
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nyusatsu/ses-sender
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: "*"

  StripeWebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: zer0-nyusatsu-stripe-webhook
      Description: Stripe Webhookを受信し課金者⇔購読者を突合してDynamoDBを更新する
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StripeWebhookFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          WAITLIST_TABLE_NAME: !Ref WaitlistTable
          # 値はCloudFormationで管理しない。事前に作成したStandard SecureStringだけを参照する。
          STRIPE_WEBHOOK_SECRET_PARAM_NAME: /nyusatsu/stripe-webhook-secret-secure
          NOTIFY_EMAIL_PARAM_NAME: /nyusatsu/notify-email
          SES_SENDER_PARAM_NAME: /nyusatsu/ses-sender
          SES_CONFIGURATION_SET_NAME: zer0-nyusatsu-config-set
      Code:
        S3Bucket: !ImportValue zer0-nyusatsu-lambda-artifacts-bucket-name
        S3Key: lambda/stripe_webhook.zip
        S3ObjectVersion: !Ref StripeWebhookCodeVersion
    DependsOn:
      - StripeWebhookLogGroup

  StripeWebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StripeWebhookFunction.Arn
      PayloadFormatVersion: "2.0"

  StripeWebhookRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /stripe/webhook"
      Target: !Sub "integrations/${StripeWebhookIntegration}"

  StripeWebhookApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StripeWebhookFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WaitlistApi}/*/*"

  # CloudWatch Alarm for stripe_webhook Lambda errors.
  # 決済が関わるLambdaのため、失敗を早期検知する(2026-07-11時点で無料枠10個中10個
  # のため、007のZer0-touring-lambda-duration-p95を削除して枠を確保した上で追加)。
  StripeWebhookErrorsAlarm01:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: zer0-nyusatsu-stripe-webhook-errors-alarm-01
      AlarmDescription: Stripe Webhook受信Lambdaでエラーが発生しています
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        # NotifyBotAlarmTopicは別スタック(cfn-nyusatsu-notify-bot.yaml)が所有するため、
        # このプロジェクトの既存クロススタック参照方式(リテラル名でARNを組み立てる)に統一する。
        - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:zer0-nyusatsu-alarm-topic

  # CloudWatch Alarm for lp_waitlist Lambda errors.
  # 登録・確認・配信停止・LINE連携・Stripe Webhookの全APIを処理する中核Lambdaにも
  # かかわらずアラームが無かった(2026-07-16時点で発覚)。無料枠10個中10個のため、
  # 007のZer0-touring-lambda-errorsを削除して枠を確保した上で追加する。
  WaitlistFunctionErrorsAlarm01:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: zer0-nyusatsu-lp-waitlist-errors-alarm-01
      AlarmDescription: lp_waitlist Lambda(登録/確認/配信停止/LINE連携/Stripe Webhook)でエラーが発生しています
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WaitlistFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:zer0-nyusatsu-alarm-topic

# -----------------------------------------------
# Outputs
# LPのJSからfetchするAPIエンドポイントURLを出力する。
# -----------------------------------------------
Outputs:
  ApiEndpoint:
    Description: Waitlist registration API endpoint (POST /register)
    Value: !Sub "https://${WaitlistApi}.execute-api.${AWS::Region}.amazonaws.com/register"
  ApiBaseUrl:
    Description: Waitlist API base URL (for building /unsubscribe links from the collector Lambda)
    Value: !Sub "https://${WaitlistApi}.execute-api.${AWS::Region}.amazonaws.com"
  WaitlistTableName:
    Description: DynamoDB table name for waitlist emails
    Value: !Ref WaitlistTable
  StripeWebhookEndpoint:
    Description: Stripe webhook endpoint URL to register in the Stripe dashboard (POST /stripe/webhook)
    Value: !Sub "https://${WaitlistApi}.execute-api.${AWS::Region}.amazonaws.com/stripe/webhook"

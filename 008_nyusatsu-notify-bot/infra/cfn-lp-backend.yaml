AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Nyusatsu Notify Bot (008) - Waitlist registration backend for the LP
  (nyusatsu.zer0-infra.com). HTTP API + Lambda + DynamoDB, all pay-per-use
  to keep idle cost near zero.

# -----------------------------------------------
# Metadata
# ParameterGroups でLP設定・ログ設定を視覚的にグループ化する。
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: LP設定
        Parameters:
          - AllowedOrigin
      - Label:
          default: ログ設定
        Parameters:
          - LogRetentionDays
    ParameterLabels:
      AllowedOrigin:
        default: CORSで許可するLPのオリジン
      LogRetentionDays:
        default: CloudWatch Logs保持日数

# -----------------------------------------------
# Parameters
# LPのオリジン（CORS許可用）とログ保持日数を指定する。
# 通知先・SES送信元は008メインスタックのSSMパラメータを再利用するため
# ここでは定義しない。
# -----------------------------------------------
Parameters:
  AllowedOrigin:
    Type: String
    Default: https://nyusatsu.zer0-infra.com
    Description: 事前登録フォームからのfetchを許可するオリジン
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 7
      - 14
      - 30
    Description: Lambda実行ログの保持日数

# -----------------------------------------------
# Resources
# DynamoDB(事前登録メール, PAY_PER_REQUEST) + Lambda(登録・二重オプトイン確認・
# 配信停止処理) + HTTP API(POST /register, GET /confirm, GET+POST /unsubscribe)
# を定義する。008メインスタックの通知先/SES送信元/HMAC秘密鍵SSMパラメータ・
# マッチ履歴テーブル(zer0-nyusatsu-match-history)を読み取り専用でそのまま再利用する
# (確認時のバックフィルウェルカムメール用、v0.11)。
# -----------------------------------------------
Resources:
  WaitlistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: zer0-nyusatsu-lp-waitlist
      BillingMode: PAY_PER_REQUEST
      # 課金開始後は顧客リストそのものになるため、誤オペ(Scan+一括更新のミス等)
      # からの復旧手段としてPITRを有効化する(Fable指摘、レビュー2026-07-11。
      # PAY_PER_REQUESTかつテーブルサイズが小さいためコスト影響はほぼ無い)。
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  # 収集Lambda(別スタック)が配信メールのList-Unsubscribeヘッダーを組み立てる際に
  # 参照するAPIベースURL。このスタックがWaitlistApiのドメインを唯一知っているため、
  # ここでSSMパラメータとして公開し、収集Lambda側は読み取り専用で参照する。
  UnsubscribeBaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /zer0/008-nyusatsu/unsubscribe-base-url
      Type: String
      Value: !Sub "https://${WaitlistApi}.execute-api.${AWS::Region}.amazonaws.com"
      Description: Nyusatsu Notify Bot waitlist API base URL (for List-Unsubscribe links)

  # Stripe Webhook署名シークレット(v0.19)。値はリテラルのプレースホルダーで固定し、
  # CFn Parameter経由にはしない。Stripeダッシュボードでwebhook作成後(本テンプレート
  # デプロイでAPIエンドポイントが確定してから)に発行される値のため、デプロイ前には
  # 実際の値を持ちえない(鶏と卵)。デプロイ後にユーザーから値を受け取り
  # `aws ssm put-parameter --overwrite`で直接更新する。このテンプレートで本行の
  # リテラル値を将来変更しない限りこの資源は再デプロイの差分対象にならないため、
  # CLIで設定した実際の値がCFn再デプロイで巻き戻されることはない。
  StripeWebhookSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /zer0/008-nyusatsu/stripe-webhook-secret
      Type: String
      Value: "REPLACE_AFTER_STRIPE_WEBHOOK_SETUP"
      Description: Stripe webhook signing secret (whsec_...) for signature verification

  WaitlistLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/zer0-nyusatsu-lp-waitlist
      RetentionInDays: !Ref LogRetentionDays

  # IAM Role for the waitlist registration Lambda function.
  # Description must stay ASCII-only per project convention.
  WaitlistFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zer0-nyusatsu-lp-waitlist-role
      Description: Execution role for Nyusatsu LP waitlist registration Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: zer0-nyusatsu-lp-waitlist-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WaitlistLogGroup.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt WaitlistTable.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zer0/008-nyusatsu/notify-email
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zer0/008-nyusatsu/ses-sender
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zer0/008-nyusatsu/hmac-secret
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zer0-nyusatsu-match-history
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

  WaitlistFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: zer0-nyusatsu-lp-waitlist
      Description: LP事前登録・二重オプトイン確認・配信停止をDynamoDB+SESで処理する
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt WaitlistFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          WAITLIST_TABLE_NAME: !Ref WaitlistTable
          NOTIFY_EMAIL_PARAM_NAME: /zer0/008-nyusatsu/notify-email
          SES_SENDER_PARAM_NAME: /zer0/008-nyusatsu/ses-sender
          HMAC_SECRET_PARAM_NAME: /zer0/008-nyusatsu/hmac-secret
          SES_CONFIGURATION_SET_NAME: zer0-nyusatsu-config-set
          MATCH_HISTORY_TABLE_NAME: zer0-nyusatsu-match-history
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              # Placeholder (Handler does not match this file, so this
              # never actually executes). Real code is deployed via
              # `aws lambda update-function-code` per CLAUDE.md rule
              # (no SAM, no S3 build artifact) before this function is
              # invoked by any real trigger.
              return {"statusCode": 200, "body": "placeholder"}
    DependsOn:
      - WaitlistLogGroup

  WaitlistApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: zer0-nyusatsu-lp-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - POST
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type

  WaitlistIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WaitlistFunction.Arn
      PayloadFormatVersion: "2.0"

  WaitlistRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /register"
      Target: !Sub "integrations/${WaitlistIntegration}"

  ConfirmRoute01:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /confirm"
      Target: !Sub "integrations/${WaitlistIntegration}"

  UnsubscribeRoute01:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "GET /unsubscribe"
      Target: !Sub "integrations/${WaitlistIntegration}"

  UnsubscribeRoute02:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /unsubscribe"
      Target: !Sub "integrations/${WaitlistIntegration}"

  WaitlistStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WaitlistApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  WaitlistApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WaitlistFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WaitlistApi}/*/*"

  StripeWebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/zer0-nyusatsu-stripe-webhook
      RetentionInDays: !Ref LogRetentionDays

  # IAM Role for the Stripe webhook receiver Lambda function.
  # Description must stay ASCII-only per project convention.
  StripeWebhookFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zer0-nyusatsu-stripe-webhook-role
      Description: Execution role for Nyusatsu Stripe webhook receiver Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: zer0-nyusatsu-stripe-webhook-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt StripeWebhookLogGroup.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource: !GetAtt WaitlistTable.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeWebhookSecretParameter}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zer0/008-nyusatsu/notify-email
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zer0/008-nyusatsu/ses-sender
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: "*"

  StripeWebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: zer0-nyusatsu-stripe-webhook
      Description: Stripe Webhookを受信し課金者⇔購読者を突合してDynamoDBを更新する
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt StripeWebhookFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          WAITLIST_TABLE_NAME: !Ref WaitlistTable
          STRIPE_WEBHOOK_SECRET_PARAM_NAME: !Ref StripeWebhookSecretParameter
          NOTIFY_EMAIL_PARAM_NAME: /zer0/008-nyusatsu/notify-email
          SES_SENDER_PARAM_NAME: /zer0/008-nyusatsu/ses-sender
          SES_CONFIGURATION_SET_NAME: zer0-nyusatsu-config-set
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              # Placeholder (Handler does not match this file, so this
              # never actually executes). Real code is deployed via
              # `aws lambda update-function-code` per CLAUDE.md rule
              # (no SAM, no S3 build artifact) before this function is
              # invoked by any real trigger.
              return {"statusCode": 200, "body": "placeholder"}
    DependsOn:
      - StripeWebhookLogGroup

  StripeWebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StripeWebhookFunction.Arn
      PayloadFormatVersion: "2.0"

  StripeWebhookRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /stripe/webhook"
      Target: !Sub "integrations/${StripeWebhookIntegration}"

  StripeWebhookApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StripeWebhookFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WaitlistApi}/*/*"

  # CloudWatch Alarm for stripe_webhook Lambda errors.
  # 決済が関わるLambdaのため、失敗を早期検知する(2026-07-11時点で無料枠10個中10個
  # のため、007のZer0-touring-lambda-duration-p95を削除して枠を確保した上で追加)。
  StripeWebhookErrorsAlarm01:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: zer0-nyusatsu-stripe-webhook-errors-alarm-01
      AlarmDescription: Stripe Webhook受信Lambdaでエラーが発生しています
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        # NotifyBotAlarmTopicは別スタック(cfn-nyusatsu-notify-bot.yaml)が所有するため、
        # このプロジェクトの既存クロススタック参照方式(リテラル名でARNを組み立てる)に統一する。
        - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:zer0-nyusatsu-alarm-topic

# -----------------------------------------------
# Outputs
# LPのJSからfetchするAPIエンドポイントURLを出力する。
# -----------------------------------------------
Outputs:
  ApiEndpoint:
    Description: Waitlist registration API endpoint (POST /register)
    Value: !Sub "https://${WaitlistApi}.execute-api.${AWS::Region}.amazonaws.com/register"
  ApiBaseUrl:
    Description: Waitlist API base URL (for building /unsubscribe links from the collector Lambda)
    Value: !Sub "https://${WaitlistApi}.execute-api.${AWS::Region}.amazonaws.com"
  WaitlistTableName:
    Description: DynamoDB table name for waitlist emails
    Value: !Ref WaitlistTable
  StripeWebhookEndpoint:
    Description: Stripe webhook endpoint URL to register in the Stripe dashboard (POST /stripe/webhook)
    Value: !Sub "https://${WaitlistApi}.execute-api.${AWS::Region}.amazonaws.com/stripe/webhook"

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Nyusatsu Notify Bot (008) - Daily collector for Yokohama city procurement
  announcements, filters cleaning/building-maintenance related cases, and
  sends email notification via SES.

# -----------------------------------------------
# Metadata
# ParameterGroups で通知先・収集設定・ログ設定を視覚的にグループ化する。
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: 通知設定
        Parameters:
          - NotifyEmail
          - SesSenderEmail
      - Label:
          default: 収集設定
        Parameters:
          - Keywords
      - Label:
          default: セキュリティ設定
        Parameters:
          - HmacSecret
      - Label:
          default: ログ設定
        Parameters:
          - LogRetentionDays
    ParameterLabels:
      NotifyEmail:
        default: 通知先メールアドレス
      SesSenderEmail:
        default: SES送信元メールアドレス（検証済みである必要あり）
      Keywords:
        default: 抽出キーワード（カンマ区切り）
      HmacSecret:
        default: 確認・配信停止リンク署名用の秘密鍵
      LogRetentionDays:
        default: CloudWatch Logs保持日数

# -----------------------------------------------
# Parameters
# デプロイ時にメールアドレス・キーワード・ログ保持日数を指定する。
# NotifyEmail/SesSenderEmailは個人情報のためデフォルト値を持たせず、必ず明示指定させる。
# -----------------------------------------------
Parameters:
  NotifyEmail:
    Type: String
    Description: 入札情報の通知を受け取るメールアドレス
  SesSenderEmail:
    Type: String
    Description: SESで検証済みの送信元メールアドレス
  Keywords:
    Type: String
    Default: "清掃,美化,害虫防除,ねずみ防除,消防用設備点検,造園,緑地,街路樹,除草,設備保守点検"
    Description: 案件名に含まれていれば通知対象とするキーワード（カンマ区切り）
  HmacSecret:
    Type: String
    NoEcho: true
    Description: 登録確認・配信停止リンクの署名に使うランダム文字列（32文字以上推奨、デプロイ時に生成して指定）
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 7
      - 14
      - 30
    Description: Lambda実行ログの保持日数

# -----------------------------------------------
# Resources
# 収集Lambda・実行ロール・DynamoDB(処理済み号管理)・SSM(設定値)・
# EventBridge(毎日起動)・DLQ(失敗時退避)・CloudWatch Logs・
# DLQ滞留監視用CloudWatch Alarm・通知用SNS・SES Configuration Set
# (バウンス/苦情検知)・自動配信停止用Lambdaを定義する。
# -----------------------------------------------
Resources:
  ProcessedKokokuTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: zer0-nyusatsu-processed-kokoku
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: kokoku_no
          AttributeType: N
      KeySchema:
        - AttributeName: kokoku_no
          KeyType: HASH

  WeeklyStatsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: zer0-nyusatsu-weekly-stats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: stats_id
          AttributeType: S
      KeySchema:
        - AttributeName: stats_id
          KeyType: HASH

  # マッチした案件の履歴(v0.11)。lp_waitlist Lambdaが登録確認時のバックフィル
  # ウェルカムメールで直近の実績を参照するために使う。60日でTTL失効させる
  # (古いデータはウェルカムメール用途以外に使わないため無期限保持は不要)。
  MatchHistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: zer0-nyusatsu-match-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: kokoku_no
          AttributeType: N
        - AttributeName: detail_no
          AttributeType: S
      KeySchema:
        - AttributeName: kokoku_no
          KeyType: HASH
        - AttributeName: detail_no
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  NotifyEmailParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /zer0/008-nyusatsu/notify-email
      Type: String
      Value: !Ref NotifyEmail
      Description: Nyusatsu Notify Bot notification recipient email

  SesSenderParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /zer0/008-nyusatsu/ses-sender
      Type: String
      Value: !Ref SesSenderEmail
      Description: Nyusatsu Notify Bot SES verified sender email

  KeywordsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /zer0/008-nyusatsu/keywords
      Type: String
      Value: !Ref Keywords
      Description: Nyusatsu Notify Bot filter keywords (comma separated)

  HmacSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /zer0/008-nyusatsu/hmac-secret
      Type: String
      Value: !Ref HmacSecret
      Description: Nyusatsu Notify Bot HMAC secret for confirm/unsubscribe link signing

  # SES Configuration Set(B-3). collector/lp_waitlist両Lambdaの送信メールに
  # 付与し、バウンス・苦情の発生をSNS経由で検知できるようにする。
  SesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: zer0-nyusatsu-config-set

  # SESバウンス・苦情通知用SNSトピック。オーナーへのEmail通知(運用把握用)+
  # 自動配信停止Lambda(BounceHandlerFunction)の両方が購読する。
  SesEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: zer0-nyusatsu-ses-events-topic

  SesEventsTopicSubscription01:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SesEventsTopic
      Protocol: email
      Endpoint: !Ref NotifyEmail

  # Configuration SetのBounce/ComplaintイベントをSNSトピックへ配信する設定。
  SesConfigurationSetEventDestination01:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SesConfigurationSet
      EventDestination:
        Name: bounce-complaint-to-sns
        Enabled: true
        MatchingEventTypes:
          - bounce
          - complaint
        SnsDestination:
          TopicARN: !Ref SesEventsTopic

  BounceHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/zer0-nyusatsu-bounce-handler
      RetentionInDays: !Ref LogRetentionDays

  # IAM Role for the SES bounce/complaint handler Lambda function.
  # Description must stay ASCII-only per project convention.
  BounceHandlerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zer0-nyusatsu-bounce-handler-role
      Description: Execution role for Nyusatsu SES bounce/complaint handler Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: zer0-nyusatsu-bounce-handler-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt BounceHandlerLogGroup.Arn
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zer0-nyusatsu-lp-waitlist

  # 苦情(Complaint)は即配信停止、Permanentバウンスのみ配信停止する
  # (Transientバウンスは一時的な不着のため対象外)。zer0-nyusatsu-lp-waitlist
  # は別スタック(cfn-lp-backend.yaml)が所有するため、テーブル名は固定文字列で
  # 参照する(このプロジェクトの既存のクロススタック参照方式に統一)。
  BounceHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: zer0-nyusatsu-bounce-handler
      Description: SESバウンス・苦情通知を受けて購読者を自動的に配信停止にする
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt BounceHandlerFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          WAITLIST_TABLE_NAME: zer0-nyusatsu-lp-waitlist
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              # Placeholder. Deployed via `aws lambda update-function-code`
              # per CLAUDE.md rule (no SAM, no S3 build artifact).
              return {"statusCode": 200, "body": "placeholder"}
    DependsOn:
      - BounceHandlerLogGroup

  BounceHandlerSnsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BounceHandlerFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref SesEventsTopic

  SesEventsTopicSubscription02:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SesEventsTopic
      Protocol: lambda
      Endpoint: !GetAtt BounceHandlerFunction.Arn

  NotifyBotDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: zer0-nyusatsu-notify-bot-dlq
      MessageRetentionPeriod: 1209600

  # SNS Topic for CloudWatch Alarm notifications.
  # DLQ滞留アラームの通知先。既存のNotifyEmailパラメータをEmail購読先として再利用する。
  NotifyBotAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: zer0-nyusatsu-alarm-topic

  # Email subscription for the alarm topic.
  # NotifyEmailパラメータのアドレスにアラーム通知メールを送る。
  NotifyBotAlarmTopicSubscription01:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotifyBotAlarmTopic
      Protocol: email
      Endpoint: !Ref NotifyEmail

  # CloudWatch Alarm for DLQ message buildup.
  # NotifyBotDLQにメッセージが1件以上滞留したら発報する。収集Lambdaの失敗継続を検知する目的。
  NotifyBotDlqAlarm01:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: zer0-nyusatsu-dlq-messages-alarm-01
      AlarmDescription: 入札情報収集LambdaのDLQにメッセージが滞留しています
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotifyBotDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotifyBotAlarmTopic

  # CloudWatch Alarm for bounce_handler Lambda errors.
  # バウンス/苦情処理LambdaはSNSトリガーでDLQを持たないため、Errorsメトリクスを
  # 直接監視する。過去にmail_forwarderで発生した「デプロイ反映漏れによる
  # サイレント機能停止」の再発を早期検知する目的(2026-07-10 Fableレビュー指摘)。
  BounceHandlerErrorsAlarm01:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: zer0-nyusatsu-bounce-handler-errors-alarm-01
      AlarmDescription: バウンス・苦情処理Lambdaでエラーが発生しています
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BounceHandlerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotifyBotAlarmTopic

  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/zer0-nyusatsu-collector
      RetentionInDays: !Ref LogRetentionDays

  # IAM Role for the collector Lambda function.
  # Description must stay ASCII-only per project convention.
  CollectorFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zer0-nyusatsu-collector-role
      Description: Execution role for Nyusatsu Notify Bot collector Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: zer0-nyusatsu-collector-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CollectorLogGroup.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt ProcessedKokokuTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt WeeklyStatsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zer0-nyusatsu-lp-waitlist
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt MatchHistoryTable.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${NotifyEmailParameter}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SesSenderParameter}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${KeywordsParameter}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${HmacSecretParameter}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zer0/008-nyusatsu/unsubscribe-base-url
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt NotifyBotDLQ.Arn

  CollectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: zer0-nyusatsu-collector
      Description: 横浜市入札公告を収集し清掃関連案件をメール通知するBot
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt CollectorFunctionRole.Arn
      Timeout: 300
      MemorySize: 256
      DeadLetterConfig:
        TargetArn: !GetAtt NotifyBotDLQ.Arn
      Environment:
        Variables:
          PROCESSED_TABLE_NAME: !Ref ProcessedKokokuTable
          WEEKLY_STATS_TABLE_NAME: !Ref WeeklyStatsTable
          NOTIFY_EMAIL_PARAM_NAME: !Ref NotifyEmailParameter
          SES_SENDER_PARAM_NAME: !Ref SesSenderParameter
          KEYWORDS_PARAM_NAME: !Ref KeywordsParameter
          HMAC_SECRET_PARAM_NAME: !Ref HmacSecretParameter
          UNSUBSCRIBE_BASE_URL_PARAM_NAME: /zer0/008-nyusatsu/unsubscribe-base-url
          WAITLIST_TABLE_NAME: zer0-nyusatsu-lp-waitlist
          SES_CONFIGURATION_SET_NAME: !Ref SesConfigurationSet
          MATCH_HISTORY_TABLE_NAME: !Ref MatchHistoryTable
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              # Placeholder. Deployed via `aws lambda update-function-code`
              # per CLAUDE.md rule (no SAM, no S3 build artifact).
              return {"statusCode": 200, "body": "placeholder"}
    DependsOn:
      - CollectorLogGroup

  SchedulerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CollectorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyScheduleRule.Arn

  DailyScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: zer0-nyusatsu-daily-schedule
      Description: 毎日6時(JST)にNyusatsu Notify Bot収集Lambdaを起動する
      ScheduleExpression: cron(0 21 * * ? *)
      State: ENABLED
      Targets:
        - Id: CollectorFunctionTarget
          Arn: !GetAtt CollectorFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt NotifyBotDLQ.Arn

# -----------------------------------------------
# Outputs
# 他スタックからの参照はないが、運用確認用にARN/名称を出力する。
# -----------------------------------------------
Outputs:
  CollectorFunctionName:
    Description: Nyusatsu Notify Bot collector Lambda function name
    Value: !Ref CollectorFunction
  ProcessedKokokuTableName:
    Description: DynamoDB table name for processed kokoku_no tracking
    Value: !Ref ProcessedKokokuTable
  WeeklyStatsTableName:
    Description: DynamoDB table name for weekly digest counter
    Value: !Ref WeeklyStatsTable
  MatchHistoryTableName:
    Description: DynamoDB table name for matched case history (used by lp_waitlist backfill welcome email)
    Value: !Ref MatchHistoryTable
  SesConfigurationSetName:
    Description: SES Configuration Set name for bounce/complaint tracking
    Value: !Ref SesConfigurationSet

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Nyusatsu Notify Bot (008) - Waitlist registration backend for the LP
  (nyusatsu.zer0-infra.com). HTTP API + Lambda + DynamoDB, all pay-per-use
  to keep idle cost near zero.

# -----------------------------------------------
# Metadata
# ParameterGroups でLP設定・ログ設定を視覚的にグループ化する。
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: LP設定
        Parameters:
          - AllowedOrigin
      - Label:
          default: ログ設定
        Parameters:
          - LogRetentionDays
    ParameterLabels:
      AllowedOrigin:
        default: CORSで許可するLPのオリジン
      LogRetentionDays:
        default: CloudWatch Logs保持日数

# -----------------------------------------------
# Parameters
# LPのオリジン（CORS許可用）とログ保持日数を指定する。
# 通知先・SES送信元は008メインスタックのSSMパラメータを再利用するため
# ここでは定義しない。
# -----------------------------------------------
Parameters:
  AllowedOrigin:
    Type: String
    Default: https://nyusatsu.zer0-infra.com
    Description: 事前登録フォームからのfetchを許可するオリジン
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 7
      - 14
      - 30
    Description: Lambda実行ログの保持日数

# -----------------------------------------------
# Resources
# DynamoDB(事前登録メール, PAY_PER_REQUEST) + Lambda(登録処理) +
# HTTP API(POST /register) を定義する。008メインスタックの
# 通知先/SES送信元SSMパラメータを読み取り専用でそのまま再利用する。
# -----------------------------------------------
Resources:
  WaitlistTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: zer0-nyusatsu-lp-waitlist
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  WaitlistLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/zer0-nyusatsu-lp-waitlist
      RetentionInDays: !Ref LogRetentionDays

  # IAM Role for the waitlist registration Lambda function.
  # Description must stay ASCII-only per project convention.
  WaitlistFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: zer0-nyusatsu-lp-waitlist-role
      Description: Execution role for Nyusatsu LP waitlist registration Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: zer0-nyusatsu-lp-waitlist-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WaitlistLogGroup.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt WaitlistTable.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zer0/008-nyusatsu/notify-email
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/zer0/008-nyusatsu/ses-sender
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

  WaitlistFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: zer0-nyusatsu-lp-waitlist
      Description: LP事前登録フォームのメールアドレスをDynamoDBに保存しSESで通知する
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt WaitlistFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          WAITLIST_TABLE_NAME: !Ref WaitlistTable
          NOTIFY_EMAIL_PARAM_NAME: /zer0/008-nyusatsu/notify-email
          SES_SENDER_PARAM_NAME: /zer0/008-nyusatsu/ses-sender
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              # Placeholder. Deployed via `aws lambda update-function-code`
              # per CLAUDE.md rule (no SAM, no S3 build artifact).
              return {"statusCode": 200, "body": "placeholder"}
    DependsOn:
      - WaitlistLogGroup

  WaitlistApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: zer0-nyusatsu-lp-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  WaitlistIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WaitlistApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WaitlistFunction.Arn
      PayloadFormatVersion: "2.0"

  WaitlistRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WaitlistApi
      RouteKey: "POST /register"
      Target: !Sub "integrations/${WaitlistIntegration}"

  WaitlistStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WaitlistApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  WaitlistApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WaitlistFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WaitlistApi}/*/*"

# -----------------------------------------------
# Outputs
# LPのJSからfetchするAPIエンドポイントURLを出力する。
# -----------------------------------------------
Outputs:
  ApiEndpoint:
    Description: Waitlist registration API endpoint (POST /register)
    Value: !Sub "https://${WaitlistApi}.execute-api.${AWS::Region}.amazonaws.com/register"
  WaitlistTableName:
    Description: DynamoDB table name for waitlist emails
    Value: !Ref WaitlistTable

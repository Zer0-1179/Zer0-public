AWSTemplateFormatVersion: "2010-09-09"
Description: "Network Load Balancer with Target Group. Supports TCP, UDP, TLS, and TCP_UDP."

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-nlb-<NlbSuffix> \
#   --template-file cfn-nlb.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     SgSuffix=web \
#     NlbSuffix=tcp \
#     Protocol=TCP \
#     Port=80
#
# With TLS (ACM certificate ARN required):
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     SgSuffix=web \
#     NlbSuffix=tls \
#     Protocol=TLS \
#     Port=443 \
#     CertificateArn=arn:aws:acm:ap-northeast-1:123456789012:certificate/xxxx
#
# NlbSuffix examples: tcp, udp, tls, 01, 02
# NOTE: NLB name and Target Group name are limited to 32 characters.
#
# Deploy order:
#   1. cfn-vpc.yaml
#   2. cfn-igw.yaml                    (internet-facing only)
#   3. cfn-security-group.yaml
#   4. cfn-security-group-ingress.yaml (open the listener port)
#   5. cfn-nlb.yaml                    (this template)
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# Organizes the parameter input UI in the CloudFormation console.
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
          - SgSuffix
          - NlbSuffix
          - Scheme
          - IpAddressType
      - Label:
          default: "Listener"
        Parameters:
          - Protocol
          - Port
      - Label:
          default: "Target Group"
        Parameters:
          - TargetType
          - TargetPort
          - DeregistrationDelay
          - PreserveClientIp
      - Label:
          default: "NLB Attributes (optional)"
        Parameters:
          - CrossZoneEnabled
          - DeletionProtectionEnabled
      - Label:
          default: "TLS (required when Protocol=TLS)"
        Parameters:
          - CertificateArn

# -----------------------------------------------
# Parameters
# VpcId and SubnetIds are imported from {ProjectName}-{Env}-vpc stack automatically.
# SecurityGroupId is imported from {ProjectName}-{Env}-sg-{SgSuffix} stack automatically.
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    Description: "Project name used as a prefix for resource names."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd
    Description: "Deployment environment. Used as part of the resource name."

  SgSuffix:
    Type: String
    Default: web
    Description: "Must match the SgSuffix used in cfn-security-group.yaml (e.g. web)."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  NlbSuffix:
    Type: String
    Default: "01"
    Description: "Purpose or sequence identifier for this NLB (e.g. tcp, udp, 01). Used in resource names and stack exports."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Scheme:
    Type: String
    Default: internet-facing
    AllowedValues:
      - internet-facing
      - internal
    Description: "internet-facing uses public subnets. internal uses private subnets."

  IpAddressType:
    Type: String
    Default: ipv4
    AllowedValues:
      - ipv4
      - dualstack
    Description: "ipv4: IPv4 only. dualstack: IPv4 and IPv6."

  Protocol:
    Type: String
    Default: TCP
    AllowedValues:
      - TCP
      - UDP
      - TLS
      - TCP_UDP
    Description: "Listener protocol. Use TLS to terminate TLS at the NLB (requires CertificateArn)."

  Port:
    Type: Number
    Default: 80
    MinValue: 1
    MaxValue: 65535
    Description: "Listener port."

  TargetType:
    Type: String
    Default: instance
    AllowedValues:
      - instance
      - ip
    Description: "instance: target by EC2 instance ID. ip: target by IP address (e.g. ECS Fargate)."

  TargetPort:
    Type: Number
    Default: 80
    MinValue: 1
    MaxValue: 65535
    Description: "Port your backend (EC2 / container) listens on."

  DeregistrationDelay:
    Type: Number
    Default: 300
    MinValue: 0
    MaxValue: 3600
    Description: "Time in seconds to wait before deregistering a target. 0 for immediate deregistration."

  PreserveClientIp:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Preserve the source IP of the client. Default false for instance targets, true for ip targets."

  CrossZoneEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable cross-zone load balancing. Routes traffic to targets in all AZs regardless of the AZ that receives the request."

  DeletionProtectionEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Prevent accidental deletion of the NLB. Enable for production."

  CertificateArn:
    Type: String
    Default: ""
    Description: "ACM certificate ARN. Required when Protocol=TLS."

# -----------------------------------------------
# Conditions
# Boolean flags derived from parameters. Use !If [Condition, IfTrue, IfFalse] to branch.
# IsInternetFacing selects public vs. private subnets. HasTls enables TLS termination at the NLB.
# -----------------------------------------------
Conditions:
  IsInternetFacing: !Equals [!Ref Scheme, "internet-facing"]
  HasTls:           !Equals [!Ref Protocol, "TLS"]

# -----------------------------------------------
# Resources
# Core AWS resources. TLS is terminated at the NLB; backend receives plain TCP.
# -----------------------------------------------
Resources:
  NlbTargetGroup01:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Env}-nlb-${NlbSuffix}-tg"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-VpcId"
      Protocol: !If [HasTls, TCP, !Ref Protocol]
      Port: !Ref TargetPort
      TargetType: !Ref TargetType
      HealthCheckEnabled: true
      HealthCheckProtocol: TCP
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: !Ref DeregistrationDelay
        - Key: preserve_client_ip.enabled
          Value: !Ref PreserveClientIp
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Env}-nlb-${NlbSuffix}-tg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

  Nlb01:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Env}-nlb-${NlbSuffix}"
      Type: network
      Scheme: !Ref Scheme
      IpAddressType: !Ref IpAddressType
      SecurityGroups:
        - Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      Subnets:
        - !If
          - IsInternetFacing
          - Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PublicSubnet01Id"
          - Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PrivateSubnet01Id"
        - !If
          - IsInternetFacing
          - Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PublicSubnet02Id"
          - Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PrivateSubnet02Id"
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: !Ref CrossZoneEnabled
        - Key: deletion_protection.enabled
          Value: !Ref DeletionProtectionEnabled
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Env}-nlb-${NlbSuffix}"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

  TcpListener01:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Nlb01
      Port: !Ref Port
      Protocol: !Ref Protocol
      SslPolicy: !If [HasTls, ELBSecurityPolicy-TLS13-1-2-2021-06, !Ref AWS::NoValue]
      Certificates: !If
        - HasTls
        - - CertificateArn: !Ref CertificateArn
        - !Ref AWS::NoValue
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NlbTargetGroup01

# -----------------------------------------------
# Outputs
# Values available after stack creation. Use Fn::ImportValue to reference cross-stack.
# Export Names use parameter values (not StackName) for predictable cross-stack references.
# -----------------------------------------------
Outputs:
  NlbArn01:
    Description: "NLB ARN"
    Value: !Ref Nlb01
    Export:
      Name: !Sub "${ProjectName}-${Env}-nlb-${NlbSuffix}-LoadBalancerArn"

  NlbDnsName01:
    Description: "NLB DNS name"
    Value: !GetAtt Nlb01.DNSName
    Export:
      Name: !Sub "${ProjectName}-${Env}-nlb-${NlbSuffix}-LoadBalancerDnsName"

  TargetGroupArn01:
    Description: "Target Group ARN"
    Value: !Ref NlbTargetGroup01
    Export:
      Name: !Sub "${ProjectName}-${Env}-nlb-${NlbSuffix}-TargetGroupArn"

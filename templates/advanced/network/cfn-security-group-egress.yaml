AWSTemplateFormatVersion: "2010-09-09"
Description: "Egress rules for an existing Security Group. Deploy after cfn-security-group.yaml."

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-sg-<SgSuffix>-egress \
#   --template-file cfn-security-group-egress.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     SgSuffix=web \
#     Egress01Port=443
#
# NOTE:
#   By default, AWS Security Groups allow all outbound traffic (0.0.0.0/0).
#   Deploy this template only when you need to restrict outbound traffic.
#   Deploying this template automatically removes the default "allow all" rule
#   and replaces it with the rules defined here.
#
# Common port examples:
#   HTTP:       80    HTTPS: 443
#   MySQL:    3306    PostgreSQL: 5432
#   SSH:        22    RDP: 3389
#
# Protocol examples:
#   tcp (default), udp, icmp, -1 (all traffic)
#
# Deploy order:
#   1. cfn-vpc.yaml
#   2. cfn-security-group.yaml         ({ProjectName}-{Env}-sg-{SgSuffix})
#   3. cfn-security-group-ingress.yaml
#   4. cfn-security-group-egress.yaml  (this template, optional)
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# Organizes the parameter input UI in the CloudFormation console.
# ParameterGroups visually groups up to 3 egress rules.
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
          - SgSuffix
      - Label:
          default: "Egress Rule 1 (required)"
        Parameters:
          - Egress01Protocol
          - Egress01Port
          - Egress01Cidr
          - Egress01CidrIpv6
      - Label:
          default: "Egress Rule 2 (optional)"
        Parameters:
          - Egress02Protocol
          - Egress02Port
          - Egress02Cidr
      - Label:
          default: "Egress Rule 3 (optional)"
        Parameters:
          - Egress03Protocol
          - Egress03Port
          - Egress03Cidr

# -----------------------------------------------
# Parameters
# SecurityGroupId is imported from {ProjectName}-{Env}-sg-{SgSuffix} stack automatically.
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    Description: "Project name used as a prefix for resource names."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd
    Description: "Deployment environment. Must match the Env used in cfn-security-group.yaml."

  SgSuffix:
    Type: String
    Default: web
    Description: "Must match the SgSuffix used in cfn-security-group.yaml."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Egress01Protocol:
    Type: String
    Default: tcp
    AllowedValues:
      - tcp
      - udp
      - icmp
      - icmpv6
      - "-1"
    Description: "IP protocol for rule 1. -1 allows all traffic on all ports."

  Egress01Port:
    Type: Number
    Default: 443
    MinValue: -1
    MaxValue: 65535
    Description: "Port for rule 1. Use -1 for all ports (when Protocol=-1 or icmp)."

  Egress01Cidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Destination IPv4 CIDR for rule 1."

  Egress01CidrIpv6:
    Type: String
    Default: ""
    Description: "Destination IPv6 CIDR for rule 1 (e.g. ::/0). Leave empty to use IPv4 only."

  Egress02Protocol:
    Type: String
    Default: tcp
    AllowedValues:
      - tcp
      - udp
      - icmp
      - icmpv6
      - "-1"
    Description: "IP protocol for rule 2."

  Egress02Port:
    Type: String
    Default: ""
    Description: "Port for rule 2. Leave empty to disable."
    AllowedPattern: "^(-1|[0-9]{1,5})?$"
    ConstraintDescription: "Port number (0-65535), -1, or empty to disable."

  Egress02Cidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Destination CIDR for rule 2."

  Egress03Protocol:
    Type: String
    Default: tcp
    AllowedValues:
      - tcp
      - udp
      - icmp
      - icmpv6
      - "-1"
    Description: "IP protocol for rule 3."

  Egress03Port:
    Type: String
    Default: ""
    Description: "Port for rule 3. Leave empty to disable."
    AllowedPattern: "^(-1|[0-9]{1,5})?$"
    ConstraintDescription: "Port number (0-65535), -1, or empty to disable."

  Egress03Cidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Destination CIDR for rule 3."

# -----------------------------------------------
# Conditions
# HasEgress02 / HasEgress03 skip optional rules when port is left empty.
# HasEgress01Ipv6 adds a separate IPv6 rule for rule 1 when Egress01CidrIpv6 is specified.
# Use !If [ConditionName, ValueIfTrue, ValueIfFalse] to control conditional resources.
# -----------------------------------------------
Conditions:
  HasEgress02:    !Not [!Equals [!Ref Egress02Port, ""]]
  HasEgress03:    !Not [!Equals [!Ref Egress03Port, ""]]
  HasEgress01Ipv6: !Not [!Equals [!Ref Egress01CidrIpv6, ""]]

# -----------------------------------------------
# Resources
# AWS::EC2::SecurityGroupEgress adds rules to an existing SG without modifying it.
# Conditional resources (EgressRule02 / EgressRule03) are skipped when port is empty.
# IPv6 rule is added separately when Egress01CidrIpv6 is specified.
# -----------------------------------------------
Resources:
  EgressRule01:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Egress01Protocol
      FromPort: !Ref Egress01Port
      ToPort: !Ref Egress01Port
      CidrIp: !Ref Egress01Cidr
      Description: !Sub "Rule 1: port ${Egress01Port} to ${Egress01Cidr}"

  EgressRule01Ipv6:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasEgress01Ipv6
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Egress01Protocol
      FromPort: !Ref Egress01Port
      ToPort: !Ref Egress01Port
      CidrIpv6: !Ref Egress01CidrIpv6
      Description: !Sub "Rule 1 IPv6: port ${Egress01Port} to ${Egress01CidrIpv6}"

  EgressRule02:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasEgress02
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Egress02Protocol
      FromPort: !Ref Egress02Port
      ToPort: !Ref Egress02Port
      CidrIp: !Ref Egress02Cidr
      Description: !Sub "Rule 2: port ${Egress02Port} to ${Egress02Cidr}"

  EgressRule03:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasEgress03
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Egress03Protocol
      FromPort: !Ref Egress03Port
      ToPort: !Ref Egress03Port
      CidrIp: !Ref Egress03Cidr
      Description: !Sub "Rule 3: port ${Egress03Port} to ${Egress03Cidr}"

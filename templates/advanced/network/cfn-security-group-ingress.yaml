AWSTemplateFormatVersion: "2010-09-09"
Description: "Ingress rules for an existing Security Group. Deploy after cfn-security-group.yaml."

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-sg-<SgSuffix>-ingress \
#   --template-file cfn-security-group-ingress.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     SgSuffix=web \
#     Ingress01Port=80 \
#     Ingress02Port=443
#
# Common port examples:
#   HTTP:       80    HTTPS: 443
#   MySQL:    3306    PostgreSQL: 5432
#   SSH:        22    RDP: 3389
#
# Protocol examples:
#   tcp (default), udp, icmp, -1 (all traffic)
#   For icmp: Port is the ICMP type (-1 for all types)
#
# Deploy order:
#   1. cfn-vpc.yaml
#   2. cfn-security-group.yaml         ({ProjectName}-{Env}-sg-{SgSuffix})
#   3. cfn-security-group-ingress.yaml (this template)
#   4. cfn-security-group-egress.yaml  (optional: only when restricting outbound)
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# Organizes the parameter input UI in the CloudFormation console.
# ParameterGroups visually groups up to 3 ingress rules.
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
          - SgSuffix
      - Label:
          default: "Ingress Rule 1 (required)"
        Parameters:
          - Ingress01Protocol
          - Ingress01Port
          - Ingress01Cidr
          - Ingress01CidrIpv6
      - Label:
          default: "Ingress Rule 2 (optional)"
        Parameters:
          - Ingress02Protocol
          - Ingress02Port
          - Ingress02Cidr
      - Label:
          default: "Ingress Rule 3 (optional)"
        Parameters:
          - Ingress03Protocol
          - Ingress03Port
          - Ingress03Cidr

# -----------------------------------------------
# Parameters
# SecurityGroupId is imported from {ProjectName}-{Env}-sg-{SgSuffix} stack automatically.
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    Description: "Project name used as a prefix for resource names."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd
    Description: "Deployment environment. Must match the Env used in cfn-security-group.yaml."

  SgSuffix:
    Type: String
    Default: web
    Description: "Must match the SgSuffix used in cfn-security-group.yaml."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Ingress01Protocol:
    Type: String
    Default: tcp
    AllowedValues:
      - tcp
      - udp
      - icmp
      - icmpv6
      - "-1"
    Description: "IP protocol for rule 1. -1 allows all traffic on all ports."

  Ingress01Port:
    Type: Number
    Default: 80
    MinValue: -1
    MaxValue: 65535
    Description: "Port for rule 1. Use -1 for all ports (when Protocol=-1 or icmp)."

  Ingress01Cidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Source IPv4 CIDR for rule 1."

  Ingress01CidrIpv6:
    Type: String
    Default: ""
    Description: "Source IPv6 CIDR for rule 1 (e.g. ::/0). Leave empty to use IPv4 only."

  Ingress02Protocol:
    Type: String
    Default: tcp
    AllowedValues:
      - tcp
      - udp
      - icmp
      - icmpv6
      - "-1"
    Description: "IP protocol for rule 2."

  Ingress02Port:
    Type: String
    Default: "443"
    Description: "Port for rule 2. Leave empty to disable."
    AllowedPattern: "^(-1|[0-9]{1,5})?$"
    ConstraintDescription: "Port number (0-65535), -1, or empty to disable."

  Ingress02Cidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Source CIDR for rule 2."

  Ingress03Protocol:
    Type: String
    Default: tcp
    AllowedValues:
      - tcp
      - udp
      - icmp
      - icmpv6
      - "-1"
    Description: "IP protocol for rule 3."

  Ingress03Port:
    Type: String
    Default: ""
    Description: "Port for rule 3. Leave empty to disable."
    AllowedPattern: "^(-1|[0-9]{1,5})?$"
    ConstraintDescription: "Port number (0-65535), -1, or empty to disable."

  Ingress03Cidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Source CIDR for rule 3."

# -----------------------------------------------
# Conditions
# HasIngress02 / HasIngress03 skip optional rules when port is left empty.
# HasIngress01Ipv6 adds a separate IPv6 rule for rule 1 when Ingress01CidrIpv6 is specified.
# Use !If [ConditionName, ValueIfTrue, ValueIfFalse] to control conditional resources.
# -----------------------------------------------
Conditions:
  HasIngress02:      !Not [!Equals [!Ref Ingress02Port, ""]]
  HasIngress03:      !Not [!Equals [!Ref Ingress03Port, ""]]
  HasIngress01Ipv6:   !Not [!Equals [!Ref Ingress01CidrIpv6, ""]]

# -----------------------------------------------
# Resources
# AWS::EC2::SecurityGroupIngress adds rules to an existing SG without modifying it.
# Conditional resources (IngressRule02 / IngressRule03) are skipped when port is empty.
# IPv6 rule is added separately when Ingress01CidrIpv6 is specified.
# -----------------------------------------------
Resources:
  IngressRule01:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Ingress01Protocol
      FromPort: !Ref Ingress01Port
      ToPort: !Ref Ingress01Port
      CidrIp: !Ref Ingress01Cidr
      Description: !Sub "Rule 1: port ${Ingress01Port} from ${Ingress01Cidr}"

  IngressRule01Ipv6:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngress01Ipv6
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Ingress01Protocol
      FromPort: !Ref Ingress01Port
      ToPort: !Ref Ingress01Port
      CidrIpv6: !Ref Ingress01CidrIpv6
      Description: !Sub "Rule 1 IPv6: port ${Ingress01Port} from ${Ingress01CidrIpv6}"

  IngressRule02:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngress02
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Ingress02Protocol
      FromPort: !Ref Ingress02Port
      ToPort: !Ref Ingress02Port
      CidrIp: !Ref Ingress02Cidr
      Description: !Sub "Rule 2: port ${Ingress02Port} from ${Ingress02Cidr}"

  IngressRule03:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngress03
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Ingress03Protocol
      FromPort: !Ref Ingress03Port
      ToPort: !Ref Ingress03Port
      CidrIp: !Ref Ingress03Cidr
      Description: !Sub "Rule 3: port ${Ingress03Port} from ${Ingress03Cidr}"

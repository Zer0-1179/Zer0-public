AWSTemplateFormatVersion: "2010-09-09"
Description: "General-purpose Lambda function with execution role and CloudWatch Logs"

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-lambda-<FunctionSuffix> \
#   --template-file cfn-lambda.yaml \
#   --capabilities CAPABILITY_NAMED_IAM \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     FunctionSuffix=api
#
# FunctionSuffix examples: api, worker, batch, notify, 01
#
# Update Lambda code after deploy:
#   zip lambda.zip index.py
#   aws lambda update-function-code \
#     --function-name my-project-dev-lambda-api \
#     --zip-file fileb://lambda.zip
#
# Deploy order:
#   1. cfn-lambda.yaml (this template — no dependencies)
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# Organizes the parameter input UI in the CloudFormation console.
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
          - FunctionSuffix
      - Label:
          default: "Runtime"
        Parameters:
          - Runtime
          - Handler
          - Timeout
          - MemorySize
      - Label:
          default: "Logs"
        Parameters:
          - LogRetentionDays
      - Label:
          default: "Permissions (optional)"
        Parameters:
          - AdditionalPolicy01
          - AdditionalPolicy02
      - Label:
          default: "Advanced Options"
        Parameters:
          - Architecture
          - EphemeralStorageSize
          - ReservedConcurrentExecutions
          - TracingMode
          - DlqArn
          - EnableVpcConfig
          - VpcSubnetIds
          - VpcSecurityGroupIds
          - LogFormat
          - LogGroupClass

# -----------------------------------------------
# Parameters
# Values passed in at deploy time. AllowedValues and Defaults are documented per-parameter.
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."
    Description: "Used as the resource name prefix (e.g. my-project)."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd
    Description: "Deployment environment (stg / dev / prd)."

  FunctionSuffix:
    Type: String
    Default: fn
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."
    Description: "Purpose identifier for this function (e.g. api, worker, batch, 01)."

  Runtime:
    Type: String
    Default: python3.13
    AllowedValues:
      - python3.13
      - python3.12
      - python3.11
      - nodejs22.x
      - nodejs20.x
    Description: "Lambda runtime."

  Handler:
    Type: String
    Default: index.lambda_handler
    Description: "Handler in the format filename.function_name. Use index.lambda_handler for inline ZipFile code."

  Timeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900
    Description: "Function timeout in seconds (max 900)."

  MemorySize:
    Type: Number
    Default: 128
    AllowedValues:
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 3008
    Description: "Memory allocated to the function in MB."

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues:
      - 1
      - 3
      - 7
      - 14
      - 30
      - 60
      - 90
      - 180
      - 365
    Description: "CloudWatch Logs retention period in days."

  AdditionalPolicy01:
    Type: String
    Default: ""
    Description: "Optional managed policy ARN to attach to the execution role (e.g. arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess)."

  AdditionalPolicy02:
    Type: String
    Default: ""
    Description: "Optional second managed policy ARN to attach to the execution role."

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues:
      - x86_64
      - arm64
    Description: "Instruction set architecture. arm64 (Graviton2) is typically 20% cheaper and faster."

  EphemeralStorageSize:
    Type: Number
    Default: 512
    MinValue: 512
    MaxValue: 10240
    Description: "/tmp ephemeral storage size in MB (512–10,240)."

  ReservedConcurrentExecutions:
    Type: String
    Default: ""
    Description: "Reserved concurrent executions. Leave empty for unreserved (default). 0 throttles all invocations."

  TracingMode:
    Type: String
    Default: PassThrough
    AllowedValues:
      - PassThrough
      - Active
    Description: "X-Ray tracing mode. Active sends traces to X-Ray (incurs additional cost)."

  DlqArn:
    Type: String
    Default: ""
    Description: "SQS queue or SNS topic ARN for failed async invocations. Leave empty to disable."

  EnableVpcConfig:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Place the function inside a VPC. Requires VpcSubnetIds and VpcSecurityGroupIds."

  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: "Comma-separated subnet IDs for VPC access. Required when EnableVpcConfig=true."

  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: "Comma-separated security group IDs for VPC access. Required when EnableVpcConfig=true."

  LogFormat:
    Type: String
    Default: Text
    AllowedValues:
      - Text
      - JSON
    Description: "CloudWatch Logs log format. JSON enables structured logging with log levels."

  LogGroupClass:
    Type: String
    Default: STANDARD
    AllowedValues:
      - STANDARD
      - INFREQUENT_ACCESS
    Description: "Log group storage class. INFREQUENT_ACCESS reduces cost for rarely-queried logs."

# -----------------------------------------------
# Conditions
# Boolean flags derived from parameters. Use !If [ConditionName, ValueIfTrue, ValueIfFalse] in Resources.
# -----------------------------------------------
Conditions:
  HasPolicy01:              !Not [!Equals [!Ref AdditionalPolicy01, ""]]
  HasPolicy02:              !Not [!Equals [!Ref AdditionalPolicy02, ""]]
  HasDlq:                   !Not [!Equals [!Ref DlqArn, ""]]
  HasVpcConfig:             !Equals [!Ref EnableVpcConfig, "true"]
  HasReservedConcurrency:   !Not [!Equals [!Ref ReservedConcurrentExecutions, ""]]

# -----------------------------------------------
# Resources
# DeletionPolicy: LogGroup is Retain. Execution role attaches AWSLambdaBasicExecutionRole
# plus up to two optional managed policies via AdditionalPolicy01/02.
# -----------------------------------------------
Resources:
  LambdaExecutionRole01:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Env}-lambda-${FunctionSuffix}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns: !If
        - HasPolicy01
        - !If
          - HasPolicy02
          - - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            - !Ref AdditionalPolicy01
            - !Ref AdditionalPolicy02
          - - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            - !Ref AdditionalPolicy01
        - !If
          - HasPolicy02
          - - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            - !Ref AdditionalPolicy02
          - - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

  LambdaFunction01:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Env}-lambda-${FunctionSuffix}"
      Description: !Sub "Lambda function for ${ProjectName}-${Env}-${FunctionSuffix}"
      Runtime: !Ref Runtime
      Handler: !Ref Handler
      Role: !GetAtt LambdaExecutionRole01.Arn
      Timeout: !Ref Timeout
      MemorySize: !Ref MemorySize
      Architectures:
        - !Ref Architecture
      EphemeralStorage:
        Size: !Ref EphemeralStorageSize
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrentExecutions, !Ref AWS::NoValue]
      TracingConfig:
        Mode: !Ref TracingMode
      DeadLetterConfig: !If
        - HasDlq
        - TargetArn: !Ref DlqArn
        - !Ref AWS::NoValue
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      LoggingConfig:
        LogFormat: !Ref LogFormat
      Code:
        # Replace the inline code below with your own logic.
        # After deploy, update with:
        #   zip lambda.zip lambda_function.py
        #   aws lambda update-function-code --function-name <FunctionName> --zip-file fileb://lambda.zip
        ZipFile: |
          def lambda_handler(event, context):
              print("Hello from Lambda")
              return {"statusCode": 200, "body": "OK"}
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

  LogGroup01:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunction01}"
      RetentionInDays: !Ref LogRetentionDays
      LogGroupClass: !Ref LogGroupClass
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

# -----------------------------------------------
# Outputs
# Stack outputs available after deployment. Use Fn::ImportValue !Sub "${AWS::StackName}-<Key>" for cross-stack references.
# -----------------------------------------------
Outputs:
  FunctionName01:
    Description: "Lambda function name"
    Value: !Ref LambdaFunction01
    Export:
      Name: !Sub "${AWS::StackName}-FunctionName"

  FunctionArn01:
    Description: "Lambda function ARN"
    Value: !GetAtt LambdaFunction01.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FunctionArn"

  RoleArn01:
    Description: "Lambda execution role ARN"
    Value: !GetAtt LambdaExecutionRole01.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"

  LogGroupName01:
    Description: "CloudWatch Log Group name"
    Value: !Ref LogGroup01
    Export:
      Name: !Sub "${AWS::StackName}-LogGroupName"

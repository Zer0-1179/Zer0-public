AWSTemplateFormatVersion: "2010-09-09"
Description: "EC2 instance with IAM role (SSM + CloudWatch), configurable OS, subnet placement and optional key pair"

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-ec2-<InstanceSuffix> \
#   --template-file cfn-ec2.yaml \
#   --capabilities CAPABILITY_NAMED_IAM \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     SgSuffix=web \
#     InstanceSuffix=web
#
# Prerequisites (stack names must follow convention):
#   VPC:  {ProjectName}-{Env}-vpc
#   SG:   {ProjectName}-{Env}-sg-{SgSuffix}
#
# Deploy order:
#   1. cfn-vpc.yaml
#   2. cfn-igw.yaml                   (if SubnetType=Public)
#   3. cfn-security-group.yaml
#   4. cfn-security-group-ingress.yaml
#   5. cfn-ec2.yaml                   (this template)
#
# Connect via SSM Session Manager (no SSH key needed):
#   aws ssm start-session --target <InstanceId>
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# Organizes the parameter input UI in the CloudFormation console.
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
          - InstanceSuffix
          - SgSuffix
      - Label:
          default: "Subnet Placement"
        Parameters:
          - SubnetType
          - SubnetNumber
      - Label:
          default: "Instance"
        Parameters:
          - OsType
          - AmiId
          - InstanceType
          - KeyName
      - Label:
          default: "Storage"
        Parameters:
          - VolumeSize
          - VolumeType
      - Label:
          default: "Advanced Options"
        Parameters:
          - EnableDetailedMonitoring
          - EnableTerminationProtection
          - ShutdownBehavior
          - EbsOptimized
          - Tenancy
          - HttpTokens
          - HttpPutResponseHopLimit
          - UserData

# -----------------------------------------------
# Parameters
# Values passed in at deploy time. Subnet and SG IDs are imported automatically using ProjectName + Env + SgSuffix.
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    Description: "Used as the resource name prefix (e.g. my-project). Lowercase letters, numbers, and hyphens only."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd
    Description: "Deployment environment."

  InstanceSuffix:
    Type: String
    Default: "01"
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."
    Description: "Purpose or sequence identifier for this instance (e.g. web, bastion, api, 01)."

  SgSuffix:
    Type: String
    Default: web
    Description: "Must match the SgSuffix used in cfn-security-group.yaml (e.g. web, bastion)."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  SubnetType:
    Type: String
    Default: Private
    AllowedValues:
      - Public
      - Private
    Description: "Place the instance in a public or private subnet."

  SubnetNumber:
    Type: String
    Default: "01"
    AllowedValues:
      - "01"
      - "02"
    Description: "AZ selector. 01 = first AZ (ap-northeast-1a), 02 = second AZ (ap-northeast-1c)."

  OsType:
    Type: String
    Default: Linux
    AllowedValues:
      - Linux
      - RHEL
      - Windows
    Description: "Linux: latest Amazon Linux 2023. RHEL: specify AmiId. Windows: latest Windows Server 2022."

  AmiId:
    Type: String
    Default: ""
    Description: "AMI ID (required when OsType=RHEL, e.g. ami-xxxxxxxxxxxxxxxxx). Ignored for Linux and Windows."

  InstanceType:
    Type: String
    Default: t3.micro
    Description: "EC2 instance type."

  KeyName:
    Type: String
    Default: ""
    Description: "EC2 Key Pair name for SSH access. Leave empty to connect via SSM Session Manager only."

  VolumeSize:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 16384
    Description: "Root EBS volume size in GiB. Windows Server requires 30 GiB minimum."

  VolumeType:
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - gp2
    Description: "Root EBS volume type. gp3 is recommended."

  EnableDetailedMonitoring:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable detailed (1-minute) CloudWatch monitoring. Default is basic (5-minute)."

  EnableTerminationProtection:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Prevent accidental termination via API or console."

  ShutdownBehavior:
    Type: String
    Default: stop
    AllowedValues:
      - stop
      - terminate
    Description: "Action on OS shutdown: stop (default) or terminate the instance."

  EbsOptimized:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable EBS-optimized dedicated throughput. Not all instance types support this."

  Tenancy:
    Type: String
    Default: default
    AllowedValues:
      - default
      - dedicated
      - host
    Description: "Instance tenancy. dedicated/host incurs additional cost."

  HttpTokens:
    Type: String
    Default: required
    AllowedValues:
      - required
      - optional
    Description: "IMDSv2 enforcement. required = IMDSv2 only (recommended). optional = allows IMDSv1."

  HttpPutResponseHopLimit:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 64
    Description: "HTTP PUT response hop limit for instance metadata. 1 for EC2, 2 for containers."

  UserData:
    Type: String
    Default: ""
    Description: "Shell script to run on first launch. Leave empty to skip."

# -----------------------------------------------
# Conditions
# Boolean flags derived from parameters. Use !If [ConditionName, ValueIfTrue, ValueIfFalse] in Resources.
# -----------------------------------------------
Conditions:
  IsLinux:                !Equals [!Ref OsType, "Linux"]
  IsWindows:              !Equals [!Ref OsType, "Windows"]
  HasKeyName:             !Not [!Equals [!Ref KeyName, ""]]
  HasUserData:            !Not [!Equals [!Ref UserData, ""]]
  IsEbsOptimized:         !Equals [!Ref EbsOptimized, "true"]
  IsDetailedMonitoring:   !Equals [!Ref EnableDetailedMonitoring, "true"]
  IsTerminationProtected: !Equals [!Ref EnableTerminationProtection, "true"]

# -----------------------------------------------
# Resources
# DeletionPolicy: not set (EC2 instance is deleted with the stack by default).
# SubnetType and SubnetNumber are interpolated into the export name
# to select the correct subnet (e.g. PublicSubnet01Id, PrivateSubnet02Id).
# SG is resolved from {ProjectName}-{Env}-sg-{SgSuffix} stack.
# -----------------------------------------------
Resources:
  Ec2InstanceRole01:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Env}-ec2-${InstanceSuffix}-role"
      Description: "EC2 instance role for SSM Session Manager and CloudWatch Agent"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

  Ec2InstanceProfile01:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-${Env}-ec2-${InstanceSuffix}-profile-01"
      Roles:
        - !Ref Ec2InstanceRole01

  Ec2Instance01:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !If
        - IsLinux
        - "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        - !If
          - IsWindows
          - "{{resolve:ssm:/aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base}}"
          - !Ref AmiId
      SubnetId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-${SubnetType}Subnet${SubnetNumber}Id"
      SecurityGroupIds:
        - Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IamInstanceProfile: !Ref Ec2InstanceProfile01
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      EbsOptimized: !If [IsEbsOptimized, true, false]
      Monitoring:
        Enabled: !If [IsDetailedMonitoring, true, false]
      DisableApiTermination: !If [IsTerminationProtected, true, false]
      InstanceInitiatedShutdownBehavior: !Ref ShutdownBehavior
      Tenancy: !Ref Tenancy
      UserData: !If [HasUserData, !Base64 !Ref UserData, !Ref AWS::NoValue]
      MetadataOptions:
        HttpTokens: !Ref HttpTokens
        HttpPutResponseHopLimit: !Ref HttpPutResponseHopLimit
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: !If [IsLinux, /dev/xvda, /dev/sda1]
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: !Ref VolumeType
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Env}-ec2-${InstanceSuffix}-01"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

# -----------------------------------------------
# Outputs
# Stack outputs available after deployment. Use Fn::ImportValue !Sub "${AWS::StackName}-<Key>" for cross-stack references.
# PublicIp is empty when the instance is placed in a private subnet.
# -----------------------------------------------
Outputs:
  Ec2InstanceId01:
    Description: "EC2 Instance ID"
    Value: !Ref Ec2Instance01
    Export:
      Name: !Sub "${AWS::StackName}-InstanceId"

  PrivateIp01:
    Description: "Private IP address"
    Value: !GetAtt Ec2Instance01.PrivateIp
    Export:
      Name: !Sub "${AWS::StackName}-PrivateIp"

  PublicIp01:
    Description: "Public IP address (empty if placed in a private subnet)"
    Value: !GetAtt Ec2Instance01.PublicIp
    Export:
      Name: !Sub "${AWS::StackName}-PublicIp"

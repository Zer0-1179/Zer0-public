AWSTemplateFormatVersion: "2010-09-09"
Description: "ECS Fargate cluster with Container Insights and FARGATE/FARGATE_SPOT capacity providers"

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-ecs-cluster \
#   --template-file cfn-ecs-cluster.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev
#
# Deploy order:
#   1. cfn-ecs-cluster.yaml (this template — no dependencies)
#   Next: cfn-ecs-service.yaml (imports ClusterName from this stack)
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# Organizes the parameter input UI in the CloudFormation console.
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
      - Label:
          default: "Observability"
        Parameters:
          - ContainerInsights
          - ExecuteCommandLogging

# -----------------------------------------------
# Parameters
# Values passed in at deploy time. AllowedValues and Defaults are documented per-parameter.
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."
    Description: "Used as the resource name prefix (e.g. my-project)."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd
    Description: "Deployment environment (stg / dev / prd)."

  ContainerInsights:
    Type: String
    Default: enabled
    AllowedValues:
      - enabled
      - disabled
    Description: "Enable CloudWatch Container Insights for metrics and logs. Incurs additional CloudWatch costs."

  ExecuteCommandLogging:
    Type: String
    Default: DEFAULT
    AllowedValues:
      - NONE
      - DEFAULT
      - OVERRIDE
    Description: "ECS Exec logging level. DEFAULT logs to CloudWatch. OVERRIDE allows custom configuration."

# -----------------------------------------------
# Resources
# FARGATE_SPOT capacity provider reduces cost for fault-tolerant workloads.
# ContainerInsights enables CloudWatch metrics and logs for the cluster.
# -----------------------------------------------
Resources:
  EcsCluster01:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-${Env}-ecs-cluster-01"
      ClusterSettings:
        - Name: containerInsights
          Value: !Ref ContainerInsights
      Configuration:
        ExecuteCommandConfiguration:
          Logging: !Ref ExecuteCommandLogging
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 1
        - CapacityProvider: FARGATE_SPOT
          Weight: 1
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Env}-ecs-cluster-01"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

# -----------------------------------------------
# Outputs
# Stack outputs available after deployment. Use Fn::ImportValue !Sub "${AWS::StackName}-<Key>" for cross-stack references.
# -----------------------------------------------
Outputs:
  ClusterName01:
    Description: "ECS cluster name"
    Value: !Ref EcsCluster01
    Export:
      Name: !Sub "${AWS::StackName}-ClusterName"

  ClusterArn01:
    Description: "ECS cluster ARN"
    Value: !GetAtt EcsCluster01.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ClusterArn"

AWSTemplateFormatVersion: "2010-09-09"
Description: "EFS File System with Mount Targets across 2 AZs (private subnets)."

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-efs-<EfsSuffix> \
#   --template-file cfn-efs.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     SgSuffix=efs \
#     EfsSuffix=shared
#
# EfsSuffix examples: shared, app, logs, 01, 02
#
# NOTE:
#   The Security Group specified by SgSuffix is applied to the mount targets.
#   Add an ingress rule for NFS (TCP port 2049) from EC2 instances to that SG
#   using cfn-security-group-ingress.yaml before mounting.
#
# Deploy order:
#   1. cfn-vpc.yaml
#   2. cfn-security-group.yaml         (SgSuffix=efs)
#   3. cfn-security-group-ingress.yaml (open TCP 2049 from EC2 CIDR or SG)
#   4. cfn-efs.yaml                    (this template)
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# Organizes the parameter input UI in the CloudFormation console.
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
          - SgSuffix
          - EfsSuffix
      - Label:
          default: "Performance"
        Parameters:
          - PerformanceMode
          - ThroughputMode
          - ProvisionedThroughputMibps
      - Label:
          default: "Lifecycle Management (optional)"
        Parameters:
          - TransitionToIA
          - TransitionToArchive
          - TransitionToPrimary
      - Label:
          default: "Options"
        Parameters:
          - BackupEnabled
          - KmsKeyArn

# -----------------------------------------------
# Parameters
# Defines input values passed at deploy time. AllowedValues constrain input.
# VpcId and SubnetIds are imported from {ProjectName}-{Env}-vpc stack automatically.
# SecurityGroupId is imported from {ProjectName}-{Env}-sg-{SgSuffix} stack automatically.
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    Description: "Used as part of the file system name and import names. Lowercase letters, numbers, and hyphens only."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd
    Description: "Deployment environment. Used as part of the file system name and import names."

  SgSuffix:
    Type: String
    Default: efs
    Description: "Must match the SgSuffix used in cfn-security-group.yaml (e.g. efs)."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  EfsSuffix:
    Type: String
    Default: shared
    Description: "Purpose or sequence identifier for this EFS (e.g. shared, app, 01)."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  PerformanceMode:
    Type: String
    Default: generalPurpose
    AllowedValues:
      - generalPurpose
      - maxIO
    Description: "generalPurpose: low latency (recommended). maxIO: high throughput for many clients. Cannot be changed after creation."

  ThroughputMode:
    Type: String
    Default: elastic
    AllowedValues:
      - bursting
      - provisioned
      - elastic
    Description: "elastic: auto-scales (recommended). bursting: scales with storage size. provisioned: fixed throughput."

  ProvisionedThroughputMibps:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1024
    Description: "Required when ThroughputMode=provisioned. Ignored otherwise. Min 1, Max 1024."

  TransitionToIA:
    Type: String
    Default: AFTER_30_DAYS
    AllowedValues:
      - AFTER_1_DAY
      - AFTER_7_DAYS
      - AFTER_14_DAYS
      - AFTER_30_DAYS
      - AFTER_60_DAYS
      - AFTER_90_DAYS
      - AFTER_180_DAYS
      - AFTER_270_DAYS
      - AFTER_365_DAYS
    Description: "Move files to Infrequent Access (IA) storage after this period. Always required (LifecyclePolicies must have at least one entry)."

  TransitionToArchive:
    Type: String
    Default: ""
    AllowedValues:
      - ""
      - AFTER_1_DAY
      - AFTER_7_DAYS
      - AFTER_14_DAYS
      - AFTER_30_DAYS
      - AFTER_60_DAYS
      - AFTER_90_DAYS
      - AFTER_180_DAYS
      - AFTER_270_DAYS
      - AFTER_365_DAYS
    Description: "Move files to Archive storage after this period. Leave empty to disable. Requires TransitionToIA."

  TransitionToPrimary:
    Type: String
    Default: ""
    AllowedValues:
      - ""
      - AFTER_1_ACCESS
    Description: "Move files back to Standard storage after first access. AFTER_1_ACCESS enables Intelligent-Tiering."

  BackupEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable AWS Backup for this file system."

  KmsKeyArn:
    Type: String
    Default: ""
    Description: "KMS key ARN for encryption at rest. Leave empty to use the AWS managed key (aws/elasticfilesystem)."

# -----------------------------------------------
# Conditions
# Boolean flags derived from parameters. Use !If [Condition, IfTrue, IfFalse] to branch.
# -----------------------------------------------
Conditions:
  IsProvisioned:          !Equals [!Ref ThroughputMode, "provisioned"]
  HasKmsKey:              !Not [!Equals [!Ref KmsKeyArn, ""]]
  IsBackupEnabled:        !Equals [!Ref BackupEnabled, "true"]
  HasTransitionToArchive: !Not [!Equals [!Ref TransitionToArchive, ""]]
  HasTransitionToPrimary: !Not [!Equals [!Ref TransitionToPrimary, ""]]

# -----------------------------------------------
# Resources
# Core AWS resources. DeletionPolicy is set per resource to control behavior on stack deletion.
# DeletionPolicy: Retain protects stored data; EFS does not support a Snapshot policy.
# LifecyclePolicies: each transition type must be a separate entry.
# Only include entries when the parameter is non-empty to avoid validation errors.
# -----------------------------------------------
Resources:
  EfsFileSystem01:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      KmsKeyId: !If [HasKmsKey, !Ref KmsKeyArn, !Ref AWS::NoValue]
      PerformanceMode: !Ref PerformanceMode
      ThroughputMode: !Ref ThroughputMode
      ProvisionedThroughputInMibps: !If [IsProvisioned, !Ref ProvisionedThroughputMibps, !Ref AWS::NoValue]
      BackupPolicy:
        Status: !If [IsBackupEnabled, ENABLED, DISABLED]
      LifecyclePolicies:
        - TransitionToIA: !Ref TransitionToIA
        - !If
          - HasTransitionToArchive
          - TransitionToArchive: !Ref TransitionToArchive
          - !Ref AWS::NoValue
        - !If
          - HasTransitionToPrimary
          - TransitionToPrimaryStorageClass: !Ref TransitionToPrimary
          - !Ref AWS::NoValue
      FileSystemTags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Env}-efs-${EfsSuffix}"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

  MountTarget01:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsFileSystem01
      SubnetId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PrivateSubnet01Id"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"

  MountTarget02:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsFileSystem01
      SubnetId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PrivateSubnet02Id"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"

# -----------------------------------------------
# Outputs
# Values available after stack creation. Use Fn::ImportValue to reference cross-stack.
# -----------------------------------------------
Outputs:
  FileSystemId01:
    Description: "EFS File System ID"
    Value: !Ref EfsFileSystem01
    Export:
      Name: !Sub "${ProjectName}-${Env}-efs-${EfsSuffix}-FileSystemId"

  FileSystemArn01:
    Description: "EFS File System ARN"
    Value: !GetAtt EfsFileSystem01.Arn
    Export:
      Name: !Sub "${ProjectName}-${Env}-efs-${EfsSuffix}-FileSystemArn"

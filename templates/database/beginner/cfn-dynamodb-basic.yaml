AWSTemplateFormatVersion: "2010-09-09"
Description: "DynamoDB table with on-demand billing and default encryption"

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-dynamodb-<TableSuffix> \
#   --template-file cfn-dynamodb-basic.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     TableSuffix=users \
#     PartitionKeyName=userId
#
# Deploy order:
#   1. cfn-dynamodb-basic.yaml (this template — no dependencies)
#
# To add a second table:
#   Deploy this template again with a different TableSuffix and PartitionKeyName.
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# Organizes the parameter input UI in the CloudFormation console.
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
          - TableSuffix
      - Label:
          default: "Table Schema"
        Parameters:
          - PartitionKeyName
          - PartitionKeyType
      - Label:
          default: "Advanced Options"
        Parameters:
          - TableClass
          - StreamEnabled
          - StreamViewType
          - PointInTimeRecovery

# -----------------------------------------------
# Parameters
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd
    Description: "Deployment environment."

  TableSuffix:
    Type: String
    Default: items
    AllowedPattern: "^[a-zA-Z0-9-]+$"
    ConstraintDescription: "Alphanumeric characters and hyphens only."
    Description: "Purpose identifier for this table (e.g. users, orders, items)."

  PartitionKeyName:
    Type: String
    Default: id
    Description: "Partition key attribute name (e.g. id, userId, orderId)."

  PartitionKeyType:
    Type: String
    Default: S
    AllowedValues:
      - S
      - N
      - B
    Description: "Partition key type. S = String, N = Number, B = Binary."

  TableClass:
    Type: String
    Default: STANDARD
    AllowedValues:
      - STANDARD
      - STANDARD_INFREQUENT_ACCESS
    Description: "Table storage class. STANDARD_INFREQUENT_ACCESS reduces cost for rarely-accessed data."

  StreamEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable DynamoDB Streams to capture item-level changes."

  StreamViewType:
    Type: String
    Default: NEW_AND_OLD_IMAGES
    AllowedValues:
      - KEYS_ONLY
      - NEW_IMAGE
      - OLD_IMAGE
      - NEW_AND_OLD_IMAGES
    Description: "Stream record content. Used only when StreamEnabled=true."

  PointInTimeRecovery:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable point-in-time recovery (PITR) for the table."

# -----------------------------------------------
# Conditions
# -----------------------------------------------
Conditions:
  IsStreamEnabled: !Equals [!Ref StreamEnabled, "true"]
  HasPitr:         !Equals [!Ref PointInTimeRecovery, "true"]

# -----------------------------------------------
# Resources
# BillingMode PAY_PER_REQUEST (on-demand) requires no capacity planning.
# SSESpecification uses the AWS-managed key (aws/dynamodb) at no additional cost.
# DeletionProtectionEnabled: false allows stack deletion to remove the table.
# -----------------------------------------------
Resources:
  DynamoDbTable01:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-${Env}-${TableSuffix}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: !Ref PartitionKeyName
          AttributeType: !Ref PartitionKeyType
      KeySchema:
        - AttributeName: !Ref PartitionKeyName
          KeyType: HASH
      # DynamoDB encrypts all data at rest by default using AWS-owned keys (free, no configuration required).
      # To use an AWS managed KMS key instead, add: SSESpecification: { SSEEnabled: true, SSEType: KMS }
      DeletionProtectionEnabled: false
      TableClass: !Ref TableClass
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [HasPitr, true, false]
      StreamSpecification: !If
        - IsStreamEnabled
        - StreamViewType: !Ref StreamViewType
        - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

# -----------------------------------------------
# Outputs
# -----------------------------------------------
Outputs:
  TableName01:
    Description: "DynamoDB table name"
    Value: !Ref DynamoDbTable01
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  TableArn01:
    Description: "DynamoDB table ARN"
    Value: !GetAtt DynamoDbTable01.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TableArn"

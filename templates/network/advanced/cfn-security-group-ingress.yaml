AWSTemplateFormatVersion: "2010-09-09"
Description: "Ingress rules for an existing Security Group. Deploy after cfn-security-group.yaml."

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-sg-<SgSuffix>-ingress \
#   --template-file cfn-security-group-ingress.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     SgSuffix=web \
#     Ingress1Port=80 \
#     Ingress2Port=443
#
# Common port examples:
#   HTTP:       80    HTTPS: 443
#   MySQL:    3306    PostgreSQL: 5432
#   SSH:        22    RDP: 3389
#
# Protocol examples:
#   tcp (default), udp, icmp, -1 (all traffic)
#   For icmp: Port is the ICMP type (-1 for all types)
#
# Deploy order:
#   1. cfn-vpc.yaml
#   2. cfn-security-group.yaml         ({ProjectName}-{Env}-sg-{SgSuffix})
#   3. cfn-security-group-ingress.yaml (this template)
#   4. cfn-security-group-egress.yaml  (optional: only when restricting outbound)
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
          - SgSuffix
      - Label:
          default: "Ingress Rule 1 (required)"
        Parameters:
          - Ingress1Protocol
          - Ingress1Port
          - Ingress1Cidr
          - Ingress1CidrIpv6
      - Label:
          default: "Ingress Rule 2 (optional)"
        Parameters:
          - Ingress2Protocol
          - Ingress2Port
          - Ingress2Cidr
      - Label:
          default: "Ingress Rule 3 (optional)"
        Parameters:
          - Ingress3Protocol
          - Ingress3Port
          - Ingress3Cidr

# -----------------------------------------------
# Parameters
# SecurityGroupId is imported from {ProjectName}-{Env}-sg-{SgSuffix} stack automatically.
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd

  SgSuffix:
    Type: String
    Default: web
    Description: "Must match the SgSuffix used in cfn-security-group.yaml."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Ingress1Protocol:
    Type: String
    Default: tcp
    AllowedValues:
      - tcp
      - udp
      - icmp
      - icmpv6
      - "-1"
    Description: "IP protocol for rule 1. -1 allows all traffic on all ports."

  Ingress1Port:
    Type: Number
    Default: 80
    MinValue: -1
    MaxValue: 65535
    Description: "Port for rule 1. Use -1 for all ports (when Protocol=-1 or icmp)."

  Ingress1Cidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Source IPv4 CIDR for rule 1."

  Ingress1CidrIpv6:
    Type: String
    Default: ""
    Description: "Source IPv6 CIDR for rule 1 (e.g. ::/0). Leave empty to use IPv4 only."

  Ingress2Protocol:
    Type: String
    Default: tcp
    AllowedValues:
      - tcp
      - udp
      - icmp
      - icmpv6
      - "-1"
    Description: "IP protocol for rule 2."

  Ingress2Port:
    Type: String
    Default: "443"
    Description: "Port for rule 2. Leave empty to disable."
    AllowedPattern: "^(-1|[0-9]{1,5})?$"
    ConstraintDescription: "Port number (0-65535), -1, or empty to disable."

  Ingress2Cidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Source CIDR for rule 2."

  Ingress3Protocol:
    Type: String
    Default: tcp
    AllowedValues:
      - tcp
      - udp
      - icmp
      - icmpv6
      - "-1"
    Description: "IP protocol for rule 3."

  Ingress3Port:
    Type: String
    Default: ""
    Description: "Port for rule 3. Leave empty to disable."
    AllowedPattern: "^(-1|[0-9]{1,5})?$"
    ConstraintDescription: "Port number (0-65535), -1, or empty to disable."

  Ingress3Cidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Source CIDR for rule 3."

# -----------------------------------------------
# Conditions
# -----------------------------------------------
Conditions:
  HasIngress02:      !Not [!Equals [!Ref Ingress2Port, ""]]
  HasIngress03:      !Not [!Equals [!Ref Ingress3Port, ""]]
  HasIngress1Ipv6:   !Not [!Equals [!Ref Ingress1CidrIpv6, ""]]

# -----------------------------------------------
# Resources
# AWS::EC2::SecurityGroupIngress adds rules to an existing SG without modifying it.
# Conditional resources (IngressRule02 / IngressRule03) are skipped when port is empty.
# IPv6 rule is added separately when Ingress1CidrIpv6 is specified.
# -----------------------------------------------
Resources:
  IngressRule01:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Ingress1Protocol
      FromPort: !Ref Ingress1Port
      ToPort: !Ref Ingress1Port
      CidrIp: !Ref Ingress1Cidr
      Description: !Sub "Rule 1: port ${Ingress1Port} from ${Ingress1Cidr}"

  IngressRule01Ipv6:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngress1Ipv6
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Ingress1Protocol
      FromPort: !Ref Ingress1Port
      ToPort: !Ref Ingress1Port
      CidrIpv6: !Ref Ingress1CidrIpv6
      Description: !Sub "Rule 1 IPv6: port ${Ingress1Port} from ${Ingress1CidrIpv6}"

  IngressRule02:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngress02
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Ingress2Protocol
      FromPort: !Ref Ingress2Port
      ToPort: !Ref Ingress2Port
      CidrIp: !Ref Ingress2Cidr
      Description: !Sub "Rule 2: port ${Ingress2Port} from ${Ingress2Cidr}"

  IngressRule03:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasIngress03
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      IpProtocol: !Ref Ingress3Protocol
      FromPort: !Ref Ingress3Port
      ToPort: !Ref Ingress3Port
      CidrIp: !Ref Ingress3Cidr
      Description: !Sub "Rule 3: port ${Ingress3Port} from ${Ingress3Cidr}"

AWSTemplateFormatVersion: "2010-09-09"
Description: "Application Load Balancer with Target Group. Supports HTTP and optional HTTPS."

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-alb-<AlbSuffix> \
#   --template-file cfn-alb.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     SgSuffix=web \
#     AlbSuffix=web
#
# With HTTPS (ACM certificate ARN required):
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     SgSuffix=web \
#     AlbSuffix=web \
#     CertificateArn=arn:aws:acm:ap-northeast-1:123456789012:certificate/xxxx
#
# AlbSuffix examples: web, api, admin, 01, 02
# NOTE: ALB name and Target Group name are limited to 32 characters.
#
# Deploy order:
#   1. cfn-vpc.yaml
#   2. cfn-igw.yaml                    (internet-facing only)
#   3. cfn-security-group.yaml
#   4. cfn-security-group-ingress.yaml (open port 80 / 443)
#   5. cfn-alb.yaml                    (this template)
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
          - SgSuffix
          - AlbSuffix
          - Scheme
          - IpAddressType
      - Label:
          default: "Target Group"
        Parameters:
          - TargetType
          - TargetPort
          - HealthCheckPath
          - MatcherHttpCode
          - DeregistrationDelay
      - Label:
          default: "Stickiness (optional)"
        Parameters:
          - StickinessEnabled
          - StickinessType
          - StickinessDuration
      - Label:
          default: "ALB Attributes (optional)"
        Parameters:
          - IdleTimeoutSeconds
          - DeletionProtectionEnabled
          - AccessLogsEnabled
          - AccessLogsBucket
          - AccessLogsPrefix
      - Label:
          default: "HTTPS (optional)"
        Parameters:
          - CertificateArn

# -----------------------------------------------
# Parameters
# VpcId and SubnetIds are imported from {ProjectName}-{Env}-vpc stack automatically.
# SecurityGroupId is imported from {ProjectName}-{Env}-sg-{SgSuffix} stack automatically.
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd

  SgSuffix:
    Type: String
    Default: web
    Description: "Must match the SgSuffix used in cfn-security-group.yaml (e.g. web)."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  AlbSuffix:
    Type: String
    Default: "01"
    Description: "Purpose or sequence identifier for this ALB (e.g. web, api, 01). Used in resource names and stack exports."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Scheme:
    Type: String
    Default: internet-facing
    AllowedValues:
      - internet-facing
      - internal
    Description: "internet-facing uses public subnets. internal uses private subnets."

  IpAddressType:
    Type: String
    Default: ipv4
    AllowedValues:
      - ipv4
      - dualstack
      - dualstack-without-public-ipv4
    Description: "ipv4: IPv4 only. dualstack: IPv4 and IPv6. dualstack-without-public-ipv4: public IPv6 + private IPv4/IPv6."

  TargetType:
    Type: String
    Default: instance
    AllowedValues:
      - instance
      - ip
    Description: "instance: target by EC2 instance ID. ip: target by IP address (e.g. ECS Fargate)."

  TargetPort:
    Type: Number
    Default: 80
    MinValue: 1
    MaxValue: 65535
    Description: "Port your backend (EC2 / container) listens on."

  HealthCheckPath:
    Type: String
    Default: "/"
    Description: "HTTP path for ALB health checks."

  MatcherHttpCode:
    Type: String
    Default: "200"
    Description: "HTTP response codes for health check success. Range (e.g. 200-299) or list (e.g. 200,302)."

  DeregistrationDelay:
    Type: Number
    Default: 300
    MinValue: 0
    MaxValue: 3600
    Description: "Time in seconds to wait before deregistering a target. 0 for immediate deregistration."

  StickinessEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable session stickiness (load balancer cookie). Routes repeat requests to the same target."

  StickinessType:
    Type: String
    Default: lb_cookie
    AllowedValues:
      - lb_cookie
      - app_cookie
    Description: "lb_cookie: ALB-managed cookie. app_cookie: application-managed cookie (requires CookieName)."

  StickinessDuration:
    Type: Number
    Default: 86400
    MinValue: 1
    MaxValue: 604800
    Description: "Stickiness cookie duration in seconds (1s to 7 days). Default: 86400 (1 day)."

  IdleTimeoutSeconds:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 4000
    Description: "Connection idle timeout in seconds. Default: 60."

  DeletionProtectionEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Prevent accidental deletion of the ALB. Enable for production."

  AccessLogsEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Enable ALB access logs to S3. Requires AccessLogsBucket."

  AccessLogsBucket:
    Type: String
    Default: ""
    Description: "S3 bucket name for ALB access logs. Required when AccessLogsEnabled=true."

  AccessLogsPrefix:
    Type: String
    Default: ""
    Description: "S3 key prefix for access logs (e.g. alb-logs/my-project). Leave empty for root."

  CertificateArn:
    Type: String
    Default: ""
    Description: "ACM certificate ARN for HTTPS. Leave empty to use HTTP only."

# -----------------------------------------------
# Conditions
# -----------------------------------------------
Conditions:
  IsInternetFacing:          !Equals [!Ref Scheme, "internet-facing"]
  HasHttps:                  !Not [!Equals [!Ref CertificateArn, ""]]
  IsStickinessEnabled:       !Equals [!Ref StickinessEnabled, "true"]
  IsDeletionProtectionEnabled: !Equals [!Ref DeletionProtectionEnabled, "true"]
  IsAccessLogsEnabled:       !Equals [!Ref AccessLogsEnabled, "true"]

# -----------------------------------------------
# Resources
# -----------------------------------------------
Resources:
  AlbTargetGroup01:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-${Env}-alb-${AlbSuffix}-tg"
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-VpcId"
      Protocol: HTTP
      Port: !Ref TargetPort
      TargetType: !Ref TargetType
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: !Ref MatcherHttpCode
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: !Ref DeregistrationDelay
        - Key: stickiness.enabled
          Value: !Ref StickinessEnabled
        - Key: stickiness.type
          Value: !If [IsStickinessEnabled, !Ref StickinessType, lb_cookie]
        - Key: stickiness.lb_cookie.duration_seconds
          Value: !Ref StickinessDuration
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Env}-alb-${AlbSuffix}-tg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

  Alb01:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-${Env}-alb-${AlbSuffix}"
      Type: application
      Scheme: !Ref Scheme
      IpAddressType: !Ref IpAddressType
      SecurityGroups:
        - Fn::ImportValue: !Sub "${ProjectName}-${Env}-sg-${SgSuffix}-SecurityGroupId"
      Subnets:
        - !If
          - IsInternetFacing
          - Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PublicSubnet01Id"
          - Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PrivateSubnet01Id"
        - !If
          - IsInternetFacing
          - Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PublicSubnet02Id"
          - Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PrivateSubnet02Id"
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: !Ref IdleTimeoutSeconds
        - Key: deletion_protection.enabled
          Value: !Ref DeletionProtectionEnabled
        - Key: access_logs.s3.enabled
          Value: !Ref AccessLogsEnabled
        - Key: access_logs.s3.bucket
          Value: !If [IsAccessLogsEnabled, !Ref AccessLogsBucket, ""]
        - Key: access_logs.s3.prefix
          Value: !Ref AccessLogsPrefix
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Env}-alb-${AlbSuffix}"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

  # HTTP:80 — forwards to TG when HTTP-only, redirects to HTTPS when certificate is set
  HttpListener01:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb01
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: !If [HasHttps, redirect, forward]
          RedirectConfig: !If
            - HasHttps
            - Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
            - !Ref AWS::NoValue
          TargetGroupArn: !If
            - HasHttps
            - !Ref AWS::NoValue
            - !Ref AlbTargetGroup01

  # HTTPS:443 — created only when CertificateArn is provided
  HttpsListener01:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasHttps
    Properties:
      LoadBalancerArn: !Ref Alb01
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup01

# -----------------------------------------------
# Outputs
# -----------------------------------------------
Outputs:
  AlbArn01:
    Description: "ALB ARN"
    Value: !Ref Alb01
    Export:
      Name: !Sub "${ProjectName}-${Env}-alb-${AlbSuffix}-LoadBalancerArn"

  AlbDnsName01:
    Description: "ALB DNS name"
    Value: !GetAtt Alb01.DNSName
    Export:
      Name: !Sub "${ProjectName}-${Env}-alb-${AlbSuffix}-LoadBalancerDnsName"

  TargetGroupArn01:
    Description: "Target Group ARN"
    Value: !Ref AlbTargetGroup01
    Export:
      Name: !Sub "${ProjectName}-${Env}-alb-${AlbSuffix}-TargetGroupArn"

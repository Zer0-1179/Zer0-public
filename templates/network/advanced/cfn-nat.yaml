AWSTemplateFormatVersion: "2010-09-09"
Description: "NAT Gateway in a public subnet with a default route in the private route table."

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# Public NAT (default, ~$33/month):
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-nat-<NatSuffix> \
#   --template-file cfn-nat.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     NatSuffix=az1
#
# Private NAT (no EIP, no internet access, for VPC-to-VPC routing):
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-nat-<NatSuffix> \
#   --template-file cfn-nat.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     NatSuffix=internal \
#     ConnectivityType=private
#
# Prerequisite (stack name must follow convention):
#   VPC: {ProjectName}-{Env}-vpc
#
# Deploy order:
#   1. cfn-vpc.yaml   (VPC, subnets, route tables)
#   2. cfn-igw.yaml   (internet access for public subnets - public NAT only)
#   3. cfn-nat.yaml   (this template)
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
          - NatSuffix
      - Label:
          default: "NAT Gateway"
        Parameters:
          - ConnectivityType

# -----------------------------------------------
# Parameters
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    Description: "Used as the Name tag prefix. Lowercase letters, numbers, and hyphens only."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd
    Description: "Deployment environment. Used as part of the Name tag."

  NatSuffix:
    Type: String
    Default: az1
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."
    Description: "AZ or sequence identifier for this NAT Gateway (e.g. az1, az2, 01)."

  ConnectivityType:
    Type: String
    Default: public
    AllowedValues:
      - public
      - private
    Description: "public: internet-facing NAT Gateway (requires EIP, ~$33/month). private: for VPC-to-VPC routing only (no EIP, no internet access)."

# -----------------------------------------------
# Conditions
# -----------------------------------------------
Conditions:
  IsPublic: !Equals [!Ref ConnectivityType, "public"]

# -----------------------------------------------
# Resources
# NAT Gateway is placed in PublicSubnet01.
# EIP provides a static outbound IP address (public NAT only).
# PrivateRoute sends all outbound traffic from private subnets through the NAT Gateway.
# -----------------------------------------------
Resources:
  ElasticIp01:
    Condition: IsPublic
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Env}-nat-${NatSuffix}-eip-01"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

  NatGateway01:
    Type: AWS::EC2::NatGateway
    Properties:
      ConnectivityType: !Ref ConnectivityType
      AllocationId: !If [IsPublic, !GetAtt ElasticIp01.AllocationId, !Ref AWS::NoValue]
      SubnetId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PublicSubnet01Id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Env}-ngw-${NatSuffix}-01"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env

  PrivateDefaultRoute01:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub "${ProjectName}-${Env}-vpc-PrivateRouteTableId"
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway01

# -----------------------------------------------
# Outputs
# -----------------------------------------------
Outputs:
  NatGatewayId01:
    Description: "NAT Gateway ID"
    Value: !Ref NatGateway01
    Export:
      Name: !Sub "${AWS::StackName}-NatGatewayId"

  ElasticIpAddress01:
    Condition: IsPublic
    Description: "Elastic IP address of the NAT Gateway (public NAT only)"
    Value: !Ref ElasticIp01
    Export:
      Name: !Sub "${AWS::StackName}-EipAddress"

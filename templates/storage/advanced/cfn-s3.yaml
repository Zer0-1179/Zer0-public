AWSTemplateFormatVersion: "2010-09-09"
Description: "S3 Bucket with environment-based configuration (versioning, encryption, lifecycle, tags)"

# -----------------------------------------------
# DEPLOY
# -----------------------------------------------
# Using AWS managed key (default):
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-s3-<BucketSuffix> \
#   --template-file cfn-s3.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=dev \
#     BucketSuffix=data
#
# Using a customer-managed KMS key (from cfn-kms stack):
# KMS_ARN=$(aws cloudformation describe-stacks \
#   --stack-name <ProjectName>-<Env>-kms \
#   --query "Stacks[0].Outputs[?OutputKey=='KmsKeyArn'].OutputValue" \
#   --output text)
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-s3-<BucketSuffix> \
#   --template-file cfn-s3.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=prd \
#     BucketSuffix=data \
#     KmsKeyId=$KMS_ARN
#
# With server access logging:
# aws cloudformation deploy \
#   --stack-name <ProjectName>-<Env>-s3-<BucketSuffix> \
#   --template-file cfn-s3.yaml \
#   --parameter-overrides \
#     ProjectName=my-project \
#     Env=prd \
#     BucketSuffix=data \
#     AccessLogsBucket=my-project-prd-s3-logs \
#     AccessLogsPrefix=data-bucket/
# -----------------------------------------------

# -----------------------------------------------
# Metadata
# Organizes the parameter input UI in the CloudFormation console.
# ParameterGroups groups parameters visually.
# -----------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "General"
        Parameters:
          - ProjectName
          - Env
          - BucketSuffix
      - Label:
          default: "Encryption (optional)"
        Parameters:
          - KmsKeyId
      - Label:
          default: "Access Logs (optional)"
        Parameters:
          - AccessLogsBucket
          - AccessLogsPrefix
      - Label:
          default: "Transfer Acceleration (optional)"
        Parameters:
          - AccelerateStatus

# -----------------------------------------------
# Parameters
# Values passed in at deploy time.
# AllowedValues restricts accepted input.
# Default sets the fallback value when omitted.
# -----------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: my-project
    Description: "Used as the bucket name prefix. Lowercase letters, numbers, and hyphens only."
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Lowercase letters, numbers, and hyphens only."

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - stg
      - dev
      - prd
    Description: "Deployment environment. prd enables versioning and sets DeletionPolicy to Retain."

  BucketSuffix:
    Type: String
    Default: ""
    Description: "Optional suffix appended to the bucket name (e.g. data, logs)."

  KmsKeyId:
    Type: String
    Default: ""
    Description: "KMS Key ARN or ID. Leave empty to use the AWS managed key (aws/s3)."

  AccessLogsBucket:
    Type: String
    Default: ""
    Description: "Destination S3 bucket name for server access logs. Leave empty to disable logging."

  AccessLogsPrefix:
    Type: String
    Default: ""
    Description: "S3 key prefix for access logs (e.g. my-bucket/). Leave empty for root of the destination bucket."

  AccelerateStatus:
    Type: String
    Default: Suspended
    AllowedValues:
      - Enabled
      - Suspended
    Description: "Enabled: S3 Transfer Acceleration for faster uploads via CloudFront edge locations. Additional cost applies."

# -----------------------------------------------
# Mappings
# Static lookup table for env-specific values.
# Reference with: !FindInMap [TableName, Key, Item]
# -----------------------------------------------
Mappings:
  Config:
    dev:
      VersioningStatus: Suspended  # Versioning disabled for dev
      ExpirationDays:   90         # Auto-delete objects after 90 days
    stg:
      VersioningStatus: Suspended  # Same as dev
      ExpirationDays:   90
    prd:
      VersioningStatus: Enabled    # Versioning enabled for prd
      ExpirationDays:   365        # Auto-delete objects after 365 days

# -----------------------------------------------
# Conditions
# Boolean flags derived from parameter values.
# -----------------------------------------------
Conditions:
  IsPrd:               !Equals [!Ref Env, prd]
  HasSuffix:           !Not [!Equals [!Ref BucketSuffix, ""]]
  HasKmsKey:           !Not [!Equals [!Ref KmsKeyId, ""]]
  HasAccessLogs:       !Not [!Equals [!Ref AccessLogsBucket, ""]]
  IsAccelerateEnabled: !Equals [!Ref AccelerateStatus, "Enabled"]

# -----------------------------------------------
# Resources
# DeletionPolicy: Retain (prd) keeps the bucket after stack deletion.
#                 Delete (dev) removes the bucket with the stack.
# -----------------------------------------------
Resources:
  S3Bucket01:
    Type: AWS::S3::Bucket
    DeletionPolicy:      !If [IsPrd, Retain, Delete]
    UpdateReplacePolicy: !If [IsPrd, Retain, Delete]
    Properties:
      BucketName: !If
        - HasSuffix
        - !Sub "${ProjectName}-${Env}-s3-${BucketSuffix}"
        - !Sub "${ProjectName}-${Env}-s3"
      VersioningConfiguration:
        Status: !FindInMap [Config, !Ref Env, VersioningStatus]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm:   "aws:kms"
              KMSMasterKeyID: !If [HasKmsKey, !Ref KmsKeyId, !Ref AWS::NoValue]
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls:       true
        BlockPublicPolicy:     true
        IgnorePublicAcls:      true
        RestrictPublicBuckets: true
      LoggingConfiguration: !If
        - HasAccessLogs
        - DestinationBucketName: !Ref AccessLogsBucket
          LogFilePrefix: !Ref AccessLogsPrefix
        - !Ref AWS::NoValue
      AccelerateConfiguration: !If
        - IsAccelerateEnabled
        - AccelerationStatus: Enabled
        - !Ref AWS::NoValue
      LifecycleConfiguration:
        Rules:
          - Id: auto-expire
            Status: Enabled
            ExpirationInDays: !FindInMap [Config, !Ref Env, ExpirationDays]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Env
          Value: !Ref Env
        - Key: Region
          Value: !Ref AWS::Region

# -----------------------------------------------
# Outputs
# Values available after stack creation.
# Export allows other stacks to reference via !ImportValue.
# -----------------------------------------------
Outputs:
  BucketName01:
    Description: "S3 bucket name"
    Value: !Ref S3Bucket01
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"

  BucketArn01:
    Description: "S3 bucket ARN"
    Value: !GetAtt S3Bucket01.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BucketArn"

  EncryptionType01:
    Description: "Server-side encryption type (always aws:kms)"
    Value: !If [HasKmsKey, "aws:kms (customer managed key)", "aws:kms (AWS managed key)"]

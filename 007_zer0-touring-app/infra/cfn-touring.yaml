AWSTemplateFormatVersion: "2010-09-09"
Description: Zer0-touring - Lambda API + API Gateway + S3 + CloudFront (PWA static site)

Parameters:
  CertificateArn:
    Type: String
    Description: ACM certificate ARN from us-east-1 (Zer0-touring-cert stack output)
    Default: ""
  EdgeSecret:
    Type: String
    NoEcho: true
    Description: Shared secret CloudFront injects as X-Origin-Verify header to origin; blocks direct execute-api access
  AdminToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Shared secret for X-Admin-Token header; when matched, Lambda skips the daily rate limit (leave empty to disable admin bypass)
  AlarmEmail:
    Type: String
    Default: ""
    Description: Email address to notify on Lambda errors / high latency / API Gateway 5xx (leave empty to skip alarm setup)

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:

  # ── S3 バケット（静的サイト用） ────────────────────────────────
  TouringBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: zer0-touring-s3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: Zer0-touring

  # ── CloudFront Origin Access Control (OAC) ─────────────────────
  TouringOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "Zer0-touring-oac-${AWS::AccountId}"
        Description: Touring PWA OAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── S3 バケットポリシー（CloudFront OACからのみ許可）──────────
  TouringBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TouringBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${TouringBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistId}"
                  - DistId: !Ref TouringDistribution

  # ── Lambda 実行ロール ──────────────────────────────────────────
  TouringLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Zer0-touring-lambda-role-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokeHaiku
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  # jp.* は cross-region inference profile → アカウント付き ARN が必要
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/jp.anthropic.claude-haiku-4-5-20251001-v1:0"
                  # 実際に呼ばれる基盤モデル（マルチリージョン）
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
        - PolicyName: DynamoDBRateLimit
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  # PutItem はジオコーディングキャッシュ（geocode#...キー）の書き込みに使用
                  - dynamodb:PutItem
                Resource: !GetAtt TouringRateLimitTable.Arn
        - PolicyName: DynamoDBShare
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt TouringShareTable.Arn
        - PolicyName: DynamoDBHistory
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt TouringHistoryTable.Arn
        - PolicyName: StatsAggregation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:PutMetricData
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${TouringBucket.Arn}/stats.json"

  # ── DynamoDB レートリミットテーブル ───────────────────────────
  TouringRateLimitTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: zer0-touring-ratelimit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: Zer0-touring

  # ── DynamoDB シェアテーブル ───────────────────────────────────
  TouringShareTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: zer0-touring-share
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: Zer0-touring

  # ── DynamoDB 履歴テーブル（端末ID単位でコース生成履歴を保持）─────
  TouringHistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: zer0-touring-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: Zer0-touring

  # ── Lambda 関数（コース提案 API） ──────────────────────────────
  TouringLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: zer0-touring-suggest
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt TouringLambdaRole.Arn
      MemorySize: 256
      Timeout: 30
      Description: ツーリングコース提案API（Bedrock Claude Haiku）
      Environment:
        Variables:
          BEDROCK_MODEL_ID: jp.anthropic.claude-haiku-4-5-20251001-v1:0
          GOOGLE_MAPS_API_KEY: ""
          DAILY_LIMIT: "3"
          SHARE_DAILY_LIMIT: "30"
          EDGE_SECRET: !Ref EdgeSecret
          ADMIN_TOKEN: !Ref AdminToken
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": '{"status":"deploying"}'}
      Tags:
        - Key: Project
          Value: Zer0-touring

  # ── Lambda ロググループ ────────────────────────────────────────
  TouringLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TouringLambdaFunction}"
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: Zer0-touring

  # ── Lambda 呼び出し許可（API Gateway から）────────────────────
  TouringLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt TouringLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TouringApi}/*/*"

  # ── Lambda 関数（利用統計集計バッチ） ────────────────────────────
  TouringStatsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: zer0-touring-stats
      Runtime: python3.14
      Handler: lambda_function.stats_handler
      Role: !GetAtt TouringLambdaRole.Arn
      MemorySize: 128
      Timeout: 30
      Description: 利用回数集計バッチ（カスタムメトリクスZer0Touring/SuggestCallsを集計しS3のstats.jsonへ書き出す。ポートフォリオサイトの利用実績グラフ用）
      Environment:
        Variables:
          STATS_BUCKET: !Ref TouringBucket
      Code:
        ZipFile: |
          def stats_handler(event, context):
              return {"statusCode": 200, "body": '{"status":"deploying"}'}
      Tags:
        - Key: Project
          Value: Zer0-touring

  # ── Lambda ロググループ（統計集計バッチ）───────────────────────
  TouringStatsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TouringStatsFunction}"
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: Zer0-touring

  # ── EventBridge Scheduler 実行ロール（統計集計Lambdaの起動専用）
  TouringSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Zer0-touring-scheduler-role-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                # スケジュール名を完全一致させるとCreateSchedule時のassume role事前検証
                # （スケジュールARNが未確定な時点で行われる）に失敗するため、
                # defaultグループ単位のワイルドカードでconfused deputy対策を維持する
                aws:SourceArn: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/*"
      Policies:
        - PolicyName: InvokeStatsLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt TouringStatsFunction.Arn

  # ── EventBridge Scheduler（毎日5時JSTに統計集計Lambdaを起動）───
  # ScheduleExpressionTimeZoneはこのアカウントのCFn Early Validationフックが
  # プロパティ自体を（値に関わらず）拒否するため使用せず、UTC基準のcron式で
  # 5:00 JST(=20:00 UTC 前日)を直接指定する
  TouringStatsSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: zer0-touring-stats-daily
      Description: 利用統計集計バッチを毎日起動しstats.jsonを更新する(UTC20:00=JST5:00)
      ScheduleExpression: "cron(0 20 * * ? *)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt TouringStatsFunction.Arn
        RoleArn: !GetAtt TouringSchedulerRole.Arn

  # ── API Gateway HTTP API（CORS: localhost 開発用）──────────────
  TouringApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: zer0-touring-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:4321"
          - "https://touring.zer0-infra.com"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Admin-Token
          - X-Device-Id
        MaxAge: 86400

  # ── Lambda インテグレーション ──────────────────────────────────
  TouringIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TouringApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt TouringLambdaFunction.Arn
      PayloadFormatVersion: "2.0"

  # ── POST /api/suggest ルート ───────────────────────────────────
  TouringSuggestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TouringApi
      RouteKey: "POST /api/suggest"
      Target: !Sub "integrations/${TouringIntegration}"

  # ── GET /api/status ルート（残り回数確認・カウント増加なし）──────
  TouringStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TouringApi
      RouteKey: "GET /api/status"
      Target: !Sub "integrations/${TouringIntegration}"

  # ── POST /api/share ルート（URL短縮・OGP保存）────────────────
  TouringSharePostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TouringApi
      RouteKey: "POST /api/share"
      Target: !Sub "integrations/${TouringIntegration}"

  # ── GET /s/{id} ルート（OGP HTML + リダイレクト）─────────────
  TouringShareGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TouringApi
      RouteKey: "GET /s/{id}"
      Target: !Sub "integrations/${TouringIntegration}"

  # ── POST /api/history ルート（端末IDに紐づく履歴保存）────────
  TouringHistoryPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TouringApi
      RouteKey: "POST /api/history"
      Target: !Sub "integrations/${TouringIntegration}"

  # ── GET /api/history ルート（端末IDの履歴一覧取得）───────────
  TouringHistoryGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TouringApi
      RouteKey: "GET /api/history"
      Target: !Sub "integrations/${TouringIntegration}"

  # ── POST /api/enrich ルート（二段階レスポンスの後段: 距離・天気の精密化）──
  TouringEnrichPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TouringApi
      RouteKey: "POST /api/enrich"
      Target: !Sub "integrations/${TouringIntegration}"

  # ── デフォルトステージ ─────────────────────────────────────────
  TouringStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref TouringApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 2

  # ── CloudFront レスポンスヘッダーポリシー ─────────────────────
  TouringResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: Zer0-touring-security-headers
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            # connect-src: Open-Meteo（天気）+ Wikipedia API（写真取得）+ Nominatim（出発地ジオコーディング）
            #              + OSRM（ルートマップのポリライン取得）
            # img-src: Wikimedia（Wikipedia写真）+ OpenStreetMapタイルサーバー（ルートマップ背景）
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.open-meteo.com https://ja.wikipedia.org https://nominatim.openstreetmap.org https://router.project-osrm.org; img-src 'self' data: https://upload.wikimedia.org https://*.tile.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'self'; manifest-src 'self'"
            Override: true
        CustomHeadersConfig:
          Items:
            # geolocation=(self) で GPS を許可（デフォルトの () は GPS を禁止するため）
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=(self)"
              Override: true

  # ── CloudFront ディストリビューション ─────────────────────────
  TouringDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Zer0-touring PWA
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Aliases: !If
          - HasCertificate
          - [touring.zer0-infra.com]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCertificate
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        Origins:
          # S3 オリジン（静的ファイル）
          - Id: S3Origin
            DomainName: !GetAtt TouringBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt TouringOAC.Id
            S3OriginConfig: {}
          # API Gateway オリジン（Lambda API）
          - Id: ApiGatewayOrigin
            DomainName: !Sub "${TouringApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            # execute-api への直接アクセス（CloudFrontバイパス）を遮断するための
            # 共有シークレット。Lambda側で X-Origin-Verify を検証し不一致なら403にする
            # （CloudFrontは "X-Edge-*" プレフィックスのヘッダー名を予約済みで使用不可）
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref EdgeSecret
        # デフォルト: S3 静的ファイル（キャッシュあり）
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          # AWS マネージドポリシー: CachingOptimized（1日キャッシュ）
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref TouringResponseHeadersPolicy
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
        # /api/* → API Gateway（キャッシュ無効・POST 転送）
        CacheBehaviors:
          - PathPattern: /s/*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref TouringResponseHeadersPolicy
            AllowedMethods: [GET, HEAD]
            CachedMethods:  [GET, HEAD]
            Compress: false
          - PathPattern: /api/*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            # AWS マネージドポリシー: CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AWS マネージドポリシー: AllViewerExceptHostHeader
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: !Ref TouringResponseHeadersPolicy
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: false
      Tags:
        - Key: Project
          Value: Zer0-touring

  # ── SNS: 障害通知トピック ──────────────────────────────────────
  TouringAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: Zer0-touring-alarms
      Tags:
        - Key: Project
          Value: Zer0-touring

  TouringAlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref TouringAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # ── CloudWatch Alarm: API Gateway 5xx エラー ──────────────────
  # 2026-07-16: 個別Lambdaエラー(TouringLambdaErrorsAlarm)は削除し枠を008の
  # lp_waitlist Lambdaアラームに譲った。5xxはLambda側の未処理例外も502として
  # 検知できるため、apigw-5xx側のみ残しても失敗検知のカバレッジは概ね維持される。
  TouringApiGw5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmName: Zer0-touring-apigw-5xx
      AlarmDescription: API Gateway で5xxエラーが発生（504タイムアウト等）
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref TouringApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref TouringAlarmTopic

Outputs:
  BucketName:
    Description: S3 bucket name
    Value: !Ref TouringBucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"

  DistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref TouringDistribution
    Export:
      Name: !Sub "${AWS::StackName}-DistributionId"

  CloudFrontDomain:
    Description: CloudFront domain (set as CNAME target in DNS)
    Value: !GetAtt TouringDistribution.DomainName
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDomain"

  ApiGatewayUrl:
    Description: API Gateway URL (for local dev)
    Value: !Sub "https://${TouringApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayUrl"

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref TouringLambdaFunction
    Export:
      Name: !Sub "${AWS::StackName}-LambdaFunctionName"

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Account-wide CloudTrail trail for API activity audit logging.
  Captures management events across all regions and stores log files
  in a dedicated S3 bucket with automatic expiration.

# -----------------------------------------------
# Parameters
# Retention period for CloudTrail log files stored in S3.
# -----------------------------------------------
Parameters:
  LogRetentionInDays:
    Type: Number
    Description: Number of days to retain CloudTrail log files in S3 before automatic deletion.
    Default: 365

Resources:
  # -----------------------------------------------
  # Resources
  # S3 bucket to store CloudTrail log files, the bucket policy required
  # for the CloudTrail service to write logs, and the Trail itself
  # (multi-region, management events only, log file validation enabled).
  # DeletionPolicy=Retain on the bucket so accidental stack deletion does
  # not destroy existing audit log history.
  # -----------------------------------------------
  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: zer0-cloudtrail-s3
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-trail-logs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionInDays
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: zer0-account-trail
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true

# -----------------------------------------------
# Outputs
# Trail ARN and log bucket name for reference / manual lookup.
# -----------------------------------------------
Outputs:
  TrailArn:
    Description: ARN of the CloudTrail trail
    Value: !GetAtt Trail.Arn
    Export:
      Name: zer0-cloudtrail-trail-arn
  TrailBucketName:
    Description: Name of the S3 bucket storing CloudTrail log files
    Value: !Ref TrailBucket

AWSTemplateFormatVersion: '2010-09-09'
Description: Grants CryptoBot permanent access to the normalized SSM namespace.

# -----------------------------------------------
# Resources
# Managed policies for the Executor and WeeklySummary roles (stack cryptobot-ssm-access).
# The same policies are also listed in ManagedPolicyArns of cfn-cryptobot.yaml.
# Removing them from either template, or deleting this stack, detaches the policy
# and stops trading. See docs/システム仕様書/04_ops_cost_and_notes.md section 10.
# -----------------------------------------------
Resources:
  ExecutorNormalizedSsmPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: cryptobot-executor-normalized-ssm-policy
      # Description is kept identical to the deployed value: changing it forces replacement of this named policy.
      Description: Grants Executor only the normalized CryptoBot SSM paths required after cutover.
      Roles:
        - Zer0-CryptoBot-ExecutorRole-ap-northeast-1
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cryptobot/bitbank/api_key
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cryptobot/bitbank/api_secret
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cryptobot/state
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cryptobot/mode
          - Effect: Allow
            Action:
              - ssm:PutParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cryptobot/state

  WeeklySummaryNormalizedSsmPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: cryptobot-weekly-summary-normalized-ssm-policy
      Description: Grants WeeklySummary read access to the normalized CryptoBot state path.
      Roles:
        - Zer0-CryptoBot-WeeklySummaryRole-ap-northeast-1
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cryptobot/state

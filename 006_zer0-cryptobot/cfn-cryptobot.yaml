AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Zer0 CryptoBot - Automated BTC/ETH/SOL margin trading bot.
  Analyzer detects signals from Binance 4h candles; Executor manages
  positions and places bitbank orders every 30 minutes.

Parameters:
  SenderEmail:
    Type: String
    Description: SES verified sender email address
  RecipientEmail:
    Type: String
    Description: Notification recipient email address
  EnableForceTest:
    Type: String
    Default: "0"
    AllowedValues:
      - "0"
      - "1"
    Description: "Enable force-test flags in Executor (0=off / 1=on). Set 1 only for test suite."
  TradesBucket:
    Type: String
    Default: zer0-dev-s3
    Description: S3 bucket for realized trade history (one object per trade). Executor puts, WeeklySummary lists and reads.

Resources:

  # ── IAM ロール: Analyzer ───────────────────────────────────────────────────
  AnalyzerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Zer0-CryptoBot-AnalyzerRole-${AWS::Region}"
      Description: Lambda execution role for Zer0-CryptoBot Analyzer
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Zer0-CryptoBot-AnalyzerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/Zer0/CryptoBot/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderEmail}"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ExecutorFunction.Arn

  # ── IAM ロール: Executor ───────────────────────────────────────────────────
  ExecutorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Zer0-CryptoBot-ExecutorRole-${AWS::Region}"
      Description: Lambda execution role for Zer0-CryptoBot Executor
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Zer0-CryptoBot-ExecutorPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/Zer0/CryptoBot/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderEmail}"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:Zer0-CryptoBot-FailureNotifier"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${TradesBucket}/cryptobot/*"
              # ListBucket がないと存在しないキーの GetObject が NoSuchKey でなく
              # AccessDenied になり、初回書き込み時の判定ができないため必要
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${TradesBucket}"
                Condition:
                  StringLike:
                    s3:prefix: "cryptobot/*"

  # ── IAM ロール: FailureNotifier ───────────────────────────────────────────
  FailureNotifierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Zer0-CryptoBot-FailureNotifierRole-${AWS::Region}"
      Description: Lambda execution role for Zer0-CryptoBot FailureNotifier
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Zer0-CryptoBot-FailureNotifierPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderEmail}"

  # ── IAM ロール: EventBridge Scheduler → Analyzer ─────────────────────────
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Zer0-CryptoBot-SchedulerRole-${AWS::Region}"
      Description: EventBridge Scheduler role for Zer0-CryptoBot Analyzer
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Zer0-CryptoBot-SchedulerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt AnalyzerFunction.Arn

  # ── IAM ロール: EventBridge Scheduler → Executor ─────────────────────────
  ExecutorSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Zer0-CryptoBot-ExecutorSchedulerRole-${AWS::Region}"
      Description: EventBridge Scheduler role for Zer0-CryptoBot Executor direct invocation
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Zer0-CryptoBot-ExecutorSchedulerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ExecutorFunction.Arn

  # ── CloudWatch Logs ───────────────────────────────────────────────────────
  AnalyzerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/Zer0-CryptoBot-Analyzer
      RetentionInDays: 7

  ExecutorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/Zer0-CryptoBot-Executor
      RetentionInDays: 3

  FailureNotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/Zer0-CryptoBot-FailureNotifier
      RetentionInDays: 7

  # ── Lambda: Analyzer ──────────────────────────────────────────────────────
  AnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: Zer0-CryptoBot-Analyzer
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt AnalyzerRole.Arn
      Description: "Zer0-CryptoBot: Binance指標分析・シグナル検出（4時間毎）"
      Environment:
        Variables:
          SES_SENDER_EMAIL: !Ref SenderEmail
          SES_RECIPIENT_EMAIL: !Ref RecipientEmail
          EXECUTOR_FUNCTION_NAME: !Ref ExecutorFunction
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - deploy via deploy.sh"}

  # ── Lambda: Executor ──────────────────────────────────────────────────────
  ExecutorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: Zer0-CryptoBot-Executor
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt ExecutorRole.Arn
      Description: "Zer0-CryptoBot: bitbank注文発注・ポジション管理"
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          SES_SENDER_EMAIL: !Ref SenderEmail
          SES_RECIPIENT_EMAIL: !Ref RecipientEmail
          ENABLE_FORCE_TEST: !Ref EnableForceTest
          TRADES_BUCKET: !Ref TradesBucket
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - deploy via deploy.sh"}

  # ── Lambda: FailureNotifier ───────────────────────────────────────────────
  FailureNotifierFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: Zer0-CryptoBot-FailureNotifier
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt FailureNotifierRole.Arn
      Description: "Zer0-CryptoBot: Executor非同期起動失敗時のSESアラート通知"
      Environment:
        Variables:
          SES_SENDER_EMAIL: !Ref SenderEmail
          SES_RECIPIENT_EMAIL: !Ref RecipientEmail
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - deploy via deploy.sh"}

  # ── Lambda EventInvokeConfig: Executor 非同期失敗時 → FailureNotifier ─────
  # MaximumRetryAttempts は 0 固定。実発注後にタイムアウト/スロットリングで
  # 失敗した場合、自動リトライすると同一シグナルで二重発注する恐れがあるため
  # （4時間毎の定期実行が実質的なリトライとして機能する）。
  ExecutorEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ExecutorFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailureNotifierFunction.Arn

  # ── SNS: CloudWatchアラーム通知トピック ──────────────────────────────────
  CryptoBotAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: Zer0-CryptoBot-Alarms

  CryptoBotAlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CryptoBotAlarmTopic
      Protocol: email
      Endpoint: !Ref RecipientEmail

  # ── CloudWatch Alarm: Executor でエラー発生（未捕捉例外・タイムアウト等）─
  ExecutorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Zer0-CryptoBot-Executor-Errors
      AlarmDescription: Zer0-CryptoBot-Executor Lambda でエラーが発生
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ExecutorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CryptoBotAlarmTopic

  # ── CloudWatch Alarm: Executor 死活監視（1時間呼び出しゼロ＝停止疑い）───
  # Executorは毎時15分・45分に起動する設計。呼び出しがゼロの期間は
  # メトリクス自体が欠損するため、TreatMissingData: breaching で
  # 「データがないこと自体」を異常として検知する。
  ExecutorHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: Zer0-CryptoBot-Executor-Heartbeat
      AlarmDescription: Zer0-CryptoBot-Executor が1時間以上呼び出されていない（スケジュール停止・IAM破損等の疑い）
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref ExecutorFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref CryptoBotAlarmTopic

  # ── IAM ロール: EventBridge Scheduler → WeeklySummary ───────────────────
  WeeklySummarySchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Zer0-CryptoBot-WeeklySummarySchedulerRole-${AWS::Region}"
      Description: EventBridge Scheduler role for Zer0-CryptoBot WeeklySummary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Zer0-CryptoBot-WeeklySummarySchedulerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WeeklySummaryFunction.Arn

  # ── IAM ロール: WeeklySummary Lambda 実行 ────────────────────────────────
  WeeklySummaryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Zer0-CryptoBot-WeeklySummaryRole-${AWS::Region}"
      Description: Execution role for Zer0-CryptoBot WeeklySummary Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Zer0-CryptoBot-WeeklySummaryPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/Zer0/CryptoBot/state"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderEmail}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${TradesBucket}/cryptobot/*"
              # ListBucket がないと存在しないキーの GetObject が NoSuchKey でなく
              # AccessDenied になるため必要（履歴ファイル未作成時の正常スキップ用）
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${TradesBucket}"
                Condition:
                  StringLike:
                    s3:prefix: "cryptobot/*"

  # ── Lambda: WeeklySummary ─────────────────────────────────────────────────
  WeeklySummaryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/Zer0-CryptoBot-WeeklySummary
      RetentionInDays: 7

  WeeklySummaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: Zer0-CryptoBot-WeeklySummary
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt WeeklySummaryRole.Arn
      Description: "Zer0-CryptoBot: 毎週日曜09:00JSTにポジション状況と含み損益・実現損益をメールで送信する週次サマリー"
      Environment:
        Variables:
          SES_SENDER_EMAIL: !Ref SenderEmail
          SES_RECIPIENT_EMAIL: !Ref RecipientEmail
          TRADES_BUCKET: !Ref TradesBucket
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder"}

  # ── EventBridge Scheduler: 毎週日曜09:00 JST → WeeklySummary ─────────────
  WeeklySummarySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: Zer0-CryptoBot-WeeklySummary-Schedule
      Description: "毎週日曜09:00JSTに週次ポジションサマリーをメール送信する"
      ScheduleExpression: "cron(0 9 ? * 1 *)"
      ScheduleExpressionTimezone: "Asia/Tokyo"
      State: ENABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt WeeklySummaryFunction.Arn
        RoleArn: !GetAtt WeeklySummarySchedulerRole.Arn

  # ── Lambda 許可: EventBridge Scheduler → WeeklySummary ───────────────────
  WeeklySummarySchedulerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WeeklySummaryFunction
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !GetAtt WeeklySummarySchedule.Arn

  # ── EventBridge Scheduler: 4時間毎 → Analyzer ────────────────────────────
  CryptoBotSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: Zer0-CryptoBot-Schedule
      Description: "4時間毎にAnalyzerを起動してシグナルを判定する"
      ScheduleExpression: "cron(0 */4 * * ? *)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt AnalyzerFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: "{}"

  # ── Lambda 許可: EventBridge Scheduler → Analyzer ────────────────────────
  AnalyzerSchedulerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AnalyzerFunction
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !GetAtt CryptoBotSchedule.Arn

  # ── EventBridge Scheduler: 毎時:15/:45 → Executor（ポジション管理）────────
  ExecutorSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: Zer0-CryptoBot-Executor-Schedule
      Description: "毎時15分・45分にExecutorを直接起動してポジション管理を実行する"
      ScheduleExpression: "cron(15,45 * * * ? *)"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ExecutorFunction.Arn
        RoleArn: !GetAtt ExecutorSchedulerRole.Arn
        Input: "{\"signals\": []}"

  # ── Lambda 許可: EventBridge Scheduler → Executor ────────────────────────
  ExecutorSchedulerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ExecutorFunction
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com
      SourceArn: !GetAtt ExecutorSchedule.Arn

Outputs:
  AnalyzerFunctionName:
    Description: Analyzer Lambda function name
    Value: !Ref AnalyzerFunction
  AnalyzerFunctionArn:
    Description: Analyzer Lambda function ARN
    Value: !GetAtt AnalyzerFunction.Arn
  ExecutorFunctionName:
    Description: Executor Lambda function name
    Value: !Ref ExecutorFunction
  ExecutorFunctionArn:
    Description: Executor Lambda function ARN
    Value: !GetAtt ExecutorFunction.Arn
  FailureNotifierFunctionName:
    Description: FailureNotifier Lambda function name
    Value: !Ref FailureNotifierFunction
  AlarmTopicArn:
    Description: CloudWatch alarm SNS topic ARN
    Value: !Ref CryptoBotAlarmTopic
  ScheduleName:
    Description: EventBridge schedule name
    Value: !Ref CryptoBotSchedule

AWSTemplateFormatVersion: "2010-09-09"
Description: X Poster Bot (zer0-infra) - Lambda + EventBridge Rule (posts AWS tips to @Zer0_Infra every Mon/Thu at 20:00 JST)

# -----------------------------------------------
# Parameters
# RecipientEmail: Lambda非同期呼び出し失敗時の通知先。空文字なら通知設定自体をスキップする。
# -----------------------------------------------
Parameters:
  RecipientEmail:
    Type: String
    Default: ""
    Description: Email address to notify when the Lambda async invocation fails (leave empty to skip)

# -----------------------------------------------
# Conditions
# HasRecipientEmail: RecipientEmailが空文字でない場合にtrue。SNSトピック・購読・OnFailure設定の要否に使う。
# -----------------------------------------------
Conditions:
  HasRecipientEmail: !Not [!Equals [!Ref RecipientEmail, ""]]

Resources:

  # ── Lambda 実行ロール ────────────────────────────────
  PosterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: x-poster-zer0-infra-role
      Description: Lambda execution role for x-poster-zer0-infra (CloudWatch Logs, SSM, Bedrock)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: xposter-ssm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/xposter/*"
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/xposter/posted-history"
        - PolicyName: xposter-bedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - "arn:aws:bedrock:ap-northeast-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "arn:aws:bedrock:ap-northeast-3::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                  - !Sub "arn:aws:bedrock:ap-northeast-1:${AWS::AccountId}:inference-profile/jp.anthropic.claude-haiku-4-5-20251001-v1:0"

  # ── Lambda 関数 ─────────────────────────────────────
  PosterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: x-poster-zer0-infra
      Description: BedrockでAWS技術情報ツイートを生成し、毎夜20時に@Zer0_InfraへXへ自動投稿するLambda関数
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt PosterRole.Arn
      Timeout: 120
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          SSM_PREFIX: /xposter
          DRY_RUN: "false"
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder"}

  # ── EventBridge: 毎週月・木 20時 JST (= UTC 11時) ──────────
  EveningRule:
    Type: AWS::Events::Rule
    Properties:
      Name: x-poster-zer0-infra-evening
      Description: 毎週月・木 20時（JST）にURL付き・ニュース紹介系を投稿
      ScheduleExpression: "cron(0 11 ? * MON,THU *)"
      State: ENABLED
      Targets:
        - Id: EveningTarget
          Arn: !GetAtt PosterFunction.Arn

  EveningPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PosterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EveningRule.Arn

  # ── Lambda EventInvokeConfig: EventBridge非同期起動のリトライを無効化 ────
  # デフォルトでは非同期呼び出し失敗時に2回自動リトライされるが、Xへの投稿は
  # 副作用（実際にツイートを送信済み）を伴うため、リトライすると同じ記事で
  # 二重投稿する恐れがある（週2回の定期実行が実質的なリトライとして機能する）。
  PosterEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    # sns:Publish権限がIAMに伝播する前にLambdaが宛先権限を検証し失敗することがあるため、
    # ポリシーアタッチ後に作成されるよう明示的に依存させる。
    DependsOn: PosterSnsPublishPolicy
    Properties:
      FunctionName: !Ref PosterFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      DestinationConfig: !If
        - HasRecipientEmail
        - OnFailure:
            Destination: !Ref PosterAlarmTopic
        - !Ref AWS::NoValue

  # ── SNS: Lambda非同期呼び出し失敗の通知 ─────────────────────────
  PosterAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasRecipientEmail
    Properties:
      TopicName: x-poster-zer0-infra-alarms

  PosterAlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasRecipientEmail
    Properties:
      TopicArn: !Ref PosterAlarmTopic
      Protocol: email
      Endpoint: !Ref RecipientEmail

  # ── IAM ポリシー: OnFailure通知のsns:Publish権限（RecipientEmail設定時のみ）──
  # Lambda非同期呼び出し失敗時にAWSサービスがこのFunction実行ロールの権限で
  # DestinationConfig先へpublishするため、実行ロール側に権限が必要。
  PosterSnsPublishPolicy:
    Type: AWS::IAM::Policy
    Condition: HasRecipientEmail
    Properties:
      PolicyName: xposter-sns-publish
      Roles:
        - !Ref PosterRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sns:Publish
            Resource: !Ref PosterAlarmTopic

  PosterLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PosterFunction}"
      RetentionInDays: 7

Outputs:
  LambdaFunctionName:
    Value: !Ref PosterFunction
  LambdaFunctionArn:
    Value: !GetAtt PosterFunction.Arn

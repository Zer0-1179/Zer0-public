AWSTemplateFormatVersion: '2010-09-09'

Description: >
  X Poster Bot (zer0-0326) - AI topic auto-posting bot for @Zer0_0326
  Lambda + EventBridge Scheduler + Bedrock (Claude Haiku) + SSM Parameter Store
  - Mon/Thu 20:00 JST: category post (url_reaction/rotation on Mon, question on Thu)
  - Every Sunday 10:00 JST: Google Trends post

# ---- Parameters ----
Parameters:
  BedrockModelId:
    Type: String
    Default: jp.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model ID (Claude Haiku 4.5 recommended)

  SsmPrefix:
    Type: String
    Default: /ai_bot
    Description: SSM parameter prefix (e.g. /ai_bot)

  RecipientEmail:
    Type: String
    Default: ""
    Description: Email address to notify when the Lambda async invocation fails (leave empty to skip)

# ---- Conditions ----
# HasRecipientEmail: RecipientEmailが空文字でない場合にtrue。SNSトピック・購読・OnFailure設定の要否に使う。
Conditions:
  HasRecipientEmail: !Not [!Equals [!Ref RecipientEmail, ""]]

# ---- Resources ----
Resources:

  # Lambda execution role
  PosterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: x-poster-zer0-0326-role
      Description: Lambda execution role for x-poster-zer0-0326 (CloudWatch Logs, Bedrock, SSM)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: x-poster-zer0-0326-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:ap-northeast-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - !Sub arn:aws:bedrock:ap-northeast-3::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - !Sub arn:aws:bedrock:ap-northeast-1:${AWS::AccountId}:inference-profile/jp.anthropic.claude-haiku-4-5-20251001-v1:0
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:ap-northeast-1:${AWS::AccountId}:parameter/ai_bot/*
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                Resource:
                  # 2026-07-05: リプ先アカウント一覧(/ai_bot/reply_target_accounts)はhistory/配下でなく
                  # 自己修復（未設定時にデフォルト値を書き込む）ロジックがあるため、GetParameterと
                  # 同じ範囲(ai_bot/*)まで許可範囲を広げた（history/*限定のままだとAccessDeniedになる）
                  - !Sub arn:aws:ssm:ap-northeast-1:${AWS::AccountId}:parameter/ai_bot/*

  # Lambda function (code deployed separately via update-function-code)
  PosterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: x-poster-zer0-0326
      Runtime: python3.14
      # url_reactionのRSS直列取得（最大30秒）+ Bedrockリトライ余裕を確保するため60→90に引き上げ
      Timeout: 90
      MemorySize: 128
      ReservedConcurrentExecutions: 1
      Handler: lambda_function.lambda_handler
      Role: !GetAtt PosterRole.Arn
      Description: "BedrockでAI関連ツイートを生成し@Zer0_0326へ自動投稿するBot（カテゴリ: recipe/jissoku/hikaku/shippai/fukugyo/question/url_reaction/trend）"
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          SSM_PREFIX: !Ref SsmPrefix
          DRY_RUN: "false"
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200, "body": "placeholder - deploy.sh will update this"}

  # Lambda EventInvokeConfig: Scheduler の RetryPolicy とは別に、Lambda自身の
  # 非同期呼び出しデフォルトリトライ（2回）も無効化する（二重投稿防止の多重防御）
  PosterEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    # sns:Publish権限がIAMに伝播する前にLambdaが宛先権限を検証し失敗することがあるため、
    # ポリシーアタッチ後に作成されるよう明示的に依存させる。
    DependsOn: PosterSnsPublishPolicy
    Properties:
      FunctionName: !Ref PosterFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      DestinationConfig: !If
        - HasRecipientEmail
        - OnFailure:
            Destination: !Ref PosterAlarmTopic
        - !Ref AWS::NoValue

  # リトライ0＋通知なしのままだと、失敗した回の投稿はログを見ない限り気づけない。
  # Lambda非同期呼び出し失敗時にSNS経由でメール通知する（RecipientEmail設定時のみ）。
  PosterAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasRecipientEmail
    Properties:
      TopicName: x-poster-zer0-0326-alarms

  PosterAlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasRecipientEmail
    Properties:
      TopicArn: !Ref PosterAlarmTopic
      Protocol: email
      Endpoint: !Ref RecipientEmail

  # OnFailure通知はこのFunction実行ロールの権限でDestinationConfig先へpublishするため、
  # 実行ロール側にsns:Publish権限が必要（RecipientEmail設定時のみ）。
  PosterSnsPublishPolicy:
    Type: AWS::IAM::Policy
    Condition: HasRecipientEmail
    Properties:
      PolicyName: x-poster-zer0-0326-sns-publish
      Roles:
        - !Ref PosterRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sns:Publish
            Resource: !Ref PosterAlarmTopic

  # CloudWatch log group
  PosterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PosterFunction}"
      RetentionInDays: 7

  # IAM role for EventBridge Scheduler
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: x-poster-zer0-0326-scheduler-role
      Description: IAM role for EventBridge Scheduler to invoke x-poster-zer0-0326 Lambda
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PosterFunction.Arn

  # EventBridge: 毎週月・木 20:00 JST (UTC 11:00)
  EveningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: x-poster-zer0-0326-evening
      Description: "毎週月・木 20:00 JSTにランダムカテゴリでAI関連ツイートを1件投稿"
      ScheduleExpression: "cron(0 11 ? * MON,THU *)"
      State: DISABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt PosterFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"mode": "random"}'
        # デフォルトのリトライ回数（185回）のままだと、Xへの投稿は既に成功しているのに
        # 一時的なエラーで再実行され同じ記事で二重投稿する恐れがあるため無効化する
        # （週2回の定期実行が実質的なリトライとして機能する）
        RetryPolicy:
          MaximumRetryAttempts: 0

  # EventBridge: 日曜10:00 JST (UTC 日曜01:00)
  TrendSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: x-poster-zer0-0326-trend
      Description: "毎週日曜10:00 JSTにGoogleトレンドを取得してAIトレンド投稿を1件生成"
      ScheduleExpression: "cron(0 1 ? * SUN *)"
      State: DISABLED
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt PosterFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"mode": "trend"}'
        RetryPolicy:
          MaximumRetryAttempts: 0

# ---- Outputs ----
Outputs:
  LambdaFunctionArn:
    Description: X Poster Bot (zer0-0326) Lambda ARN
    Value: !GetAtt PosterFunction.Arn

  LambdaFunctionName:
    Description: X Poster Bot (zer0-0326) Lambda function name
    Value: !Ref PosterFunction

  EveningScheduleName:
    Description: 定期投稿スケジュール名（毎週月・木 20:00 JST）
    Value: !Ref EveningSchedule

  TrendScheduleName:
    Description: 週次トレンド投稿スケジュール名（毎週日曜10:00 JST）
    Value: !Ref TrendSchedule
